<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Assistant widget open on company website</title>
<!-- design runtime (React) omitted -->
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px">
<dc-import name="Website" start-open="{{true}}" accent="{{accent}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0E5E50&quot;,&quot;options&quot;:[&quot;#0E5E50&quot;,&quot;#1F4E79&quot;,&quot;#7A2E1F&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0E5E50' };
}
}
</script>


</body></html>
