# Streamlit settings, read from the directory `streamlit run` starts in (the repo root; /app in Docker).

[server]
# The file watcher inspects every imported module to decide what to reload. transformers' image modules
# import torchvision, which this app does not install, so each start logged ~50 harmless tracebacks.
# The pilot is not edited while it runs; for development, start with --server.fileWatcherType auto.
fileWatcherType = "none"
headless = true
# Fonts and the B mark in src/ragbot/static/ are served at app/static/… (theme.fontFaces below).
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's developer menu items (Deploy, Clear cache): "Deploy now" would publish the app to
# Streamlit Community Cloud, which must never receive company data. Staff keep Print. (With the custom theme
# below Streamlit offers no light/dark switch: the design is light only.)
toolbarMode = "viewer"

# ── Look: docs/design/DESIGN.md (tokens). src/ragbot/ui/style.css does what the theme cannot. ──
[theme]
base = "light"
primaryColor = "#0E5E50"
backgroundColor = "#F4F5F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18201D"
linkColor = "#0E5E50"
borderColor = "#DADDD6"
dataframeBorderColor = "#ECEEEA"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
greenColor = "#1D7A45"
redColor = "#B42318"
orangeColor = "#D9822B"
font = "IBM Plex Sans, Segoe UI, system-ui, sans-serif"
codeFont = "IBM Plex Mono, Consolas, ui-monospace, monospace"
headingFont = "IBM Plex Sans, Segoe UI, system-ui, sans-serif"
chartCategoricalColors = ["#0E5E50", "#5FB8A3", "#D9822B", "#1F4E79", "#B42318", "#7A2E1F", "#9AA8A2"]

# IBM Plex (SIL OFL, src/ragbot/static/fonts/OFL.txt), taken from the design export: Sans is one variable file per
# script subset; Bangla falls back to the system font.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin.woff2"
weight = "100 700"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin-ext.woff2"
weight = "100 700"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-latin.woff2"
weight = "400"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[theme.sidebar]
backgroundColor = "#14211D"
secondaryBackgroundColor = "#1C2C27"
textColor = "#E8ECE9"
borderColor = "#3A4A44"
linkColor = "#8FD3B6"
