- name: buyer_list
  agent: order
  database: BitopiSplint
  example: 'give me buyer names'
  follow_ups:
    - 'What are the upcoming PCDs?'
  description: Names of the buyers that have export orders ("give me buyer names", "list buyers").
  answer_list: '{n} buyer(s) with export orders'
  # not when an order code is present: "buyer name for TAL-25-1493-215" is eo_by_id
  match: '(?i)^(?!.*\b[A-Z]{2,4}-\d{2,4}-\d{2,5})(?=.*\bbuyers?\b)(?=.*\b(?:names?|list)\b)'
  sql: |
    SELECT DISTINCT TOP (200) Buyer
    FROM rag.vw_ExportOrder
    WHERE Buyer IS NOT NULL
