  description: One factory's confirmed orders whose ship date passed in the window (default the last 30 days) with no export invoice yet.
  answer_list: '{factory} confirmed orders past their ship date ({window}) with no export invoice yet, earliest first ({n} shown)'
  match: '(?i)^(?!.*\b(?:most|top|least|per|each|grouped|by\s+(?:supplier|buyer|factory|line|unit|merchandiser|purpose)s?)\b).*?\b(TAL|RHL|BGL|KTL)\b.*\b(?:orders?|eos?)\b.*\b(?:behind\s+schedule|late|overdue|delayed|past\s+(?:their\s+|the\s+)?ship(?:ment)?\s+dates?|missed\s+(?:their\s+|the\s+)?ship(?:ment)?\s+dates?|not\s+(?:yet\s+)?(?:shipped|invoiced))\b(?:.*\b(last \d+ days|this month|this week)\b)?'
  params:
    factory: { from_group: 1, upper: true }
    window:  { from_group: 2, type: date_window, default: 'last 30 days' }
