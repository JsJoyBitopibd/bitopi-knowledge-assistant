- name: lines_above_dhu_target_window
  agent: quality
  database: VistaQ_Default_RHL
  example: 'Which lines are above the DHU target today?'
  follow_ups:
    - 'Which lines have the highest DHU {window}?'
    - 'Show me the defect summary {window}'
  description: Sewing lines whose DHU in a period is above the DHU target set in VistaQ, highest first.
  answer_list: 'Lines above the DHU target {window}, highest DHU first ({n} lines)'
  match: '(?i)^(?=(?:.*?\b({period})\b)?)(?=(?:.*?\b(TAL|RHL|BGL)\b)?)(?=.*\bdhu\b).*\blines?\b.*\b(?:above|over|exceed(?:s|ed|ing)?|cross(?:es|ed|ing)?|beyond|breach(?:es|ed|ing)?|missed|failed)\b.*\b(?:target|limit|threshold)\b'
  unless: *vq_unless
  params:
    window: { from_group: 1, type: date_window, default: 'today' }
    factory: { from_group: 2, upper: true, default: '' }
  heavy: true
  sql: |
    SELECT TOP (200)
      CASE WHEN MIN(InspectionDate) = MAX(InspectionDate) THEN CAST(MIN(InspectionDate) AS varchar(10))
        ELSE CAST(MIN(InspectionDate) AS varchar(10)) + ' to ' + CAST(MAX(InspectionDate) AS varchar(10)) END AS [Date],
      Factory, Unit, Line, SUM(Checked) AS Checked, SUM(Defects) AS Defects,
      CAST(100.0 * SUM(Defects) / NULLIF(SUM(Checked), 0) AS decimal(6,2)) AS DHU,
      (SELECT TOP (1) DHUTarget FROM rag.vw_QCTarget ORDER BY EffectiveFrom DESC) AS DHUTarget
    FROM rag.vw_LineDayQuality
    WHERE (@factory = '' OR Factory = @factory) AND InspectionDate >= @from AND InspectionDate < @to
    GROUP BY Factory, Unit, Line
    HAVING 100.0 * SUM(Defects) / NULLIF(SUM(Checked), 0) > (SELECT TOP (1) DHUTarget FROM rag.vw_QCTarget ORDER BY EffectiveFrom DESC)
    ORDER BY DHU DESC

