  answer_list: 'QC summary by factory {window}, live from VistaQ ({n} factories)'
  match: '(?i)^(?!.*\b(?:TAL|RHL|BGL)\b)(?=(?:.*?\b({period})\b)?)(?:(?=.*\b(?:qc|quality|dhu)\s+(?:summary|status|report|overview|position)\b)|(?!.*\b(?:lines?|target|limit|threshold|buyers?|styles?|stages?|capas?|corrective)\b)(?=.*\bdhu\b))'
  unless: *vq_unless
  params:
    window: { from_group: 1, type: date_window, default: 'today' }
  heavy: true
  sql: |
    SELECT TOP (10)
      CASE WHEN MIN(InspectionDate) = MAX(InspectionDate) THEN CAST(MIN(InspectionDate) AS varchar(10))
        ELSE CAST(MIN(InspectionDate) AS varchar(10)) + ' to ' + CAST(MAX(InspectionDate) AS varchar(10)) END AS [Date],
      Factory, SUM(Checked) AS Checked, SUM(Passed) AS Passed, SUM(DefectivePcs) AS DefectivePcs,
