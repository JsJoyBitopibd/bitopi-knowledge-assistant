  description: One factory's defects found in a period from VistaQ, by defect type and category, most frequent first.
  answer_list: '{factory} defects found {window}, by type, most frequent first ({n} defect types)'
  match: '(?i)^(?=(?:.*?\b({period})\b)?)(?=.*\b(TAL|RHL|BGL)\b).*\b(?:defect\s+summary|top\s+defects|defects?\s+by\s+type|most\s+common\s+defects|defect\s+types?|types?\s+of\s+defects)\b'
  unless: *vq_unless
  params:
    window: { from_group: 1, type: date_window, default: 'today' }
    factory: { from_group: 2, upper: true }
  heavy: true
  sql: |
    SELECT TOP (50)
      CASE WHEN MIN(DefectDate) = MAX(DefectDate) THEN CAST(MIN(DefectDate) AS varchar(10))
        ELSE CAST(MIN(DefectDate) AS varchar(10)) + ' to ' + CAST(MAX(DefectDate) AS varchar(10)) END AS [Date],
      Defect, DefectCategory, COUNT(*) AS Defects
    FROM rag.vw_QCDefect
    WHERE (@factory = '' OR Factory = @factory) AND DefectDate >= @from AND DefectDate < @to
    GROUP BY Defect, DefectCategory
    ORDER BY Defects DESC

