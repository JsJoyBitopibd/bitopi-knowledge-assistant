# Hand-written parameterised SQL for the most common data questions.
# Matched by regex against the (rewritten) question, tried IN THIS ORDER — the first match wins
# (see match_fixed_tool in src/ragbot/data/tools.py), so more specific tools are listed before the
# broad catch-alls (eo_by_id, eo_by_po) that would otherwise shadow them (a real bug this ordering
# fixes: "PCD history for TAL-17-382-1" contains both an order code and the word "pcd", so it used
# to match the generic eo_by_id before ever reaching pcd_history_by_eo).
# Params are extracted by regex groups or by type: date_window (resolved by tools._date_window:
# today / this week / next week / next N days). Every tool declares its `database:` — validated
# against the loaded catalog list at run time.

# `answer:` (one value, e.g. a COUNT) / `answer_list:` (rows): the lead sentence of a templated
# answer written with no model call (agent/templated.py). Placeholders: the tool's params,
# {value} (the single value), {n} (row count). Use nothing else: the text must pass verify().

# `requires:` regexes that must all match too; `unless:` a regex that, when it matches, skips the tool — for a
# qualifier its SQL cannot apply (a QC stage, a line, a PO), so the question goes to model-written SQL instead of
# getting an answer that silently ignores part of it.

# `example:` a question that must reach this tool: scripts/check_catalog.py checks the match offline and
# runs the tool live with the parameters it extracts (--live). `follow_ups:` next questions shown under a
# fixed-tool answer, filled with its parameters ({factory}, {window}, {eo}, ...); each should reach a
# fixed tool so a click answers without a model call (tests/test_follow_ups.py checks both).

- name: pcd_history_by_eo
  agent: order
  database: BitopiSplint
  example: 'PCD history for TAL-22-523-81'
  follow_ups:
    - 'What is the status of export order {eo}?'
  description: History of PCD and ship-date changes for one export order.
  answer_list: 'PCD and ship-date history for {eo}: {n} version(s)'
  match: '(?i)\b(pcd|cut\s*date|ship\s*date)\b.*\b(history|change|changes|changed)\b.*\b([A-Z]{2,4}-\d{2,4}-\d{2,5}(?:-\d+)?)\b|\bhistory\b.*\b(pcd|ship\s*date)\b.*\b([A-Z]{2,4}-\d{2,4}-\d{2,5}(?:-\d+)?)\b'
  params:
    eo: { from_group: [3, 5] }
  # Live, this scans dbo.ExportOrderBack (4.2M rows, unindexed): ~10 s, sometimes a timeout. Answered
  # from the nightly local copy (config/aggregates.yaml: pcd_history); live only on "Refresh data" or
  # when no copy exists, then with the 30 s heavy timeout.
  heavy: true
  aggregate: pcd_history
  local_sql: |
    SELECT ExportOrderID, VersionNo, PCD, ShipDate, UpdatedBy, DateUpdated
    FROM pcd_history
    WHERE ExportOrderID = @eo
    ORDER BY VersionNo
    LIMIT 50
  sql: |
    SELECT TOP (50)
      ExportOrderID, VersionNo, PCD, ShipDate, UpdatedBy, DateUpdated
    FROM rag.vw_PCDChangeHistory
    WHERE ExportOrderID = @eo
    ORDER BY VersionNo

- name: orders_count_by_factory_ship_window
  agent: order
  database: BitopiSplint
  example: 'How many TAL orders are shipping next week?'
  follow_ups:
    - 'Which {factory} orders have a ship date {window}?'
    - 'Which {factory} orders have a PCD {window}?'
  description: Count of orders with ship date in a date window for one factory.
  answer: '{factory} has {value} order(s) with a ship date {window}'
  match: '(?i)\bhow many\b.*\b(TAL|RHL|BGL|KTL)\b.*\b(ship|shipping|shipment)\b.*\b(this week|next week|next \d+ days)\b'
  params:
    factory: { from_group: 1, upper: true }
    window:  { from_group: 3, type: date_window }
  sql: |
    SELECT COUNT(*) AS Orders
    FROM rag.vw_ExportOrder
    WHERE Factory = @factory AND ShipDate >= @from AND ShipDate < @to

- name: ppm_meetings_count_by_factory_window
  agent: order
  database: Production
  example: 'How many PPM meetings does TAL have next week?'
  follow_ups:
    - 'List the PPM meetings for {factory} {window}'
  description: Count of PPM meetings for one factory in a date window.
  answer: '{factory} has {value} PPM meeting(s) {window}'
  match: '(?i)\bhow many\b.*\bppm\b.*\b(TAL|RHL|BGL|KTL)\b.*\b(today|this week|next week|next \d+ days)\b'
  params:
    factory: { from_group: 1, upper: true }
    window:  { from_group: 2, type: date_window }
  sql: |
    SELECT COUNT(*) AS Meetings
    FROM rag.vw_PPMMeeting
    WHERE FactoryID = @factory AND PPMDate >= @from AND PPMDate < @to

- name: orders_by_factory_pcd_window
  agent: order
  database: BitopiSplint
  example: 'Which TAL orders have a PCD next week?'
  follow_ups:
    - 'How many {factory} orders are shipping {window}?'
    - 'What are the next PCDs at {factory}?'
  description: Confirmed orders with PCD in a date window for one factory (TAL / RHL / BGL / KTL).
  answer_list: '{n} {factory} order(s) have a PCD {window}'
  match: '(?i)\b(TAL|RHL|BGL|KTL)\b.*\bPCD\b.*\b(this week|next week|next \d+ days)\b|\b(this week|next week|next \d+ days)\b.*\bPCD\b.*\b(TAL|RHL|BGL|KTL)\b'
  params:
    factory: { from_group: [1, 4], upper: true }
    window:  { from_group: [2, 3], type: date_window }
  sql: |
    SELECT TOP (200)
      ExportOrderID, ExportPONo, Buyer, StyleName, OrderQty,
      PCD, ShipDate, ExportOrderStatus, ShipmentStatus
    FROM rag.vw_ExportOrder
    WHERE Factory = @factory AND PCD >= @from AND PCD < @to
    ORDER BY PCD, ExportOrderID

- name: orders_by_factory_ship_window
  agent: order
  database: BitopiSplint
  example: 'Which RHL orders have a ship date next week?'
  follow_ups:
    - 'Which {factory} orders have a PCD {window}?'
    - 'How many PPM meetings does {factory} have {window}?'
  description: Orders with ship date in a date window for one factory.
  answer_list: '{n} {factory} order(s) have a ship date {window}'
  match: '(?i)\b(TAL|RHL|BGL|KTL)\b.*\b(ship(?:ment|ping|-|\s+)?date|shipping)\b.*\b(this week|next week|next \d+ days)\b'
  params:
    factory: { from_group: 1, upper: true }
    window:  { from_group: 3, type: date_window }
  sql: |
    SELECT TOP (200)
      ExportOrderID, ExportPONo, Buyer, StyleName, OrderQty,
      PCD, ShipDate, ShipmentStatus
    FROM rag.vw_ExportOrder
    WHERE Factory = @factory AND ShipDate >= @from AND ShipDate < @to
    ORDER BY ShipDate, ExportOrderID

- name: ppm_meetings_by_factory_window
  agent: order
  database: Production
  example: 'PPM meetings for TAL next week'
  follow_ups:
    - 'How many PPM meetings does {factory} have {window}?'
    - 'Which {factory} orders have a PCD {window}?'
  description: PPM meetings for one factory in a date window.
  answer_list: '{n} PPM meeting(s) for {factory} {window}'
  match: '(?i)\bppm(?:\s+meetings?)?\b.*\b(TAL|RHL|BGL|KTL)\b.*\b(today|this week|next week|next \d+ days)\b'
  params:
    factory: { from_group: 1, upper: true }
    window:  { from_group: 2, type: date_window }
  sql: |
    SELECT TOP (200)
      MeetingId, FileRefID, ExportPONumber, StyleID, OrderQuantity,
      PPMDate, PPMTime, LastPCD, LastShipmentDate, Status, Location
    FROM rag.vw_PPMMeeting
    WHERE FactoryID = @factory AND PPMDate >= @from AND PPMDate < @to
    ORDER BY PPMDate, MeetingId

# --- added 2026-09-27 from real questions in logs/chat.csv (C7): each used to cost a SQL-generation call
- name: upcoming_pcds_by_factory
  agent: order
  database: BitopiSplint
  example: 'What are the next PCDs at TAL?'
  follow_ups:
    - 'Which {factory} orders have a PCD next week?'
    - 'How many {factory} orders are shipping next week?'
  description: The next PCDs from today for one factory ("TAL next PCD").
  answer_list: 'Next PCDs at {factory}: {n} order(s)'
  match: '(?i)\b(TAL|RHL|BGL|KTL|CKDL)\b.*\b(?:upcoming|next|latest|nearest)\s+pcds?\b|\b(?:upcoming|next|latest|nearest)\s+pcds?\b.*\b(TAL|RHL|BGL|KTL|CKDL)\b'
  params:
    factory: { from_group: [1, 2], upper: true }
  sql: |
    SELECT TOP (20) ExportOrderID, Buyer, StyleName, OrderQty, PCD, ShipDate, Factory
    FROM rag.vw_ExportOrder
    WHERE Factory = @factory AND PCD >= CAST(GETDATE() AS date)
      AND ExportOrderStatus NOT IN ('CLOSED', 'CANCELLED')
    ORDER BY PCD, ExportOrderID

- name: upcoming_pcds_by_buyer
  agent: order
  database: BitopiSplint
  example: 'H&M upcoming PCDs'
  follow_ups:
    - 'What are the upcoming PCDs?'
  description: The next PCDs from today for one buyer ("H&M upcoming PCD", "next PCDs for Zara").
  answer_list: 'Next PCDs for {buyer}: {n} order(s)'
  # the buyer is a capitalised word next to "upcoming/next PCD"; factory codes are not buyers
  match: '(?i)\b(?-i:(?!(?:TAL|RHL|BGL|KTL|CKDL|PCD)\b)([A-Z][A-Za-z0-9&.\-]{1,24}))\s+(?:upcoming|next)\s+pcds?\b|\b(?:upcoming|next)\s+pcds?\s+(?:for|of)\s+(?:buyer\s+)?(?-i:(?!(?:TAL|RHL|BGL|KTL|CKDL)\b)([A-Z][A-Za-z0-9&.\-]{1,24}))'
  params:
    buyer: { from_group: [1, 2] }
  sql: |
    SELECT TOP (20) ExportOrderID, Buyer, StyleName, OrderQty, PCD, ShipDate, Factory
    FROM rag.vw_ExportOrder
    WHERE Buyer LIKE '%' + @buyer + '%' AND PCD >= CAST(GETDATE() AS date)
      AND ExportOrderStatus NOT IN ('CLOSED', 'CANCELLED')
    ORDER BY PCD, ExportOrderID

- name: upcoming_pcds
  agent: order
  database: BitopiSplint
  example: 'What are the upcoming PCDs?'
  follow_ups:
    - 'How many export orders were cancelled this month?'
    - 'give me buyer names'
  description: The next PCDs from today across all buyers ("next PCD", "upcoming PCDs", "latest PCD").
  answer_list: 'The next {n} PCD(s) from today'
  match: '(?i)\b(?:upcoming|next|latest|nearest)\s+pcds?\b|\bpcds?\s+(?:coming\s+up|upcoming)\b'
  sql: |
    SELECT TOP (20) ExportOrderID, Buyer, StyleName, OrderQty, PCD, ShipDate, Factory
    FROM rag.vw_ExportOrder
    WHERE PCD >= CAST(GETDATE() AS date) AND ExportOrderStatus NOT IN ('CLOSED', 'CANCELLED')
    ORDER BY PCD, ExportOrderID

# ---- Phase K: Stage-1 agent tools (docs/AGENTS_DESIGN.md). `agent:` names the domain agent that owns the
# tool (config/agents/<agent>.yaml); it is logged with the answer and picks the agent's charter.

- name: bblcs_expiring_count_window
  agent: finance_lc
  database: BitopiSplint
  example: 'How many back-to-back LCs expire next month?'
  follow_ups:
    - 'Which back-to-back LCs expire {window}?'
  description: Count of back-to-back LCs (not cancelled, not placeholders) expiring in a date window.
  answer: 'Back-to-back LCs expiring {window}: {value}'
  match: '(?i)^(?!.*\b(?:most|top|least|per|each|grouped|by\s+(?:supplier|buyer|factory|line|unit|merchandiser|purpose)s?)\b).*?\bhow many\b.*\b(?:back[\s-]*to[\s-]*back|btb|bb\s*lcs?)\b.*\bexpir\w*\b.*\b(today|this week|next week|this month|next month|next \d+ days|last \d+ days)\b'
  params:
    window: { from_group: 1, type: date_window }
  sql: |
    SELECT COUNT(*) AS BackToBackLCs
    FROM rag.vw_BackToBackLC
    WHERE ExpiryDate >= @from AND ExpiryDate < @to AND Cancelled = 0 AND Fake = 0

- name: bblcs_expiring_window
  agent: finance_lc
  database: BitopiSplint
  example: 'Which back-to-back LCs expire next week?'
  follow_ups:
    - 'How many back-to-back LCs expire {window}?'
    - 'Which LCs expire {window}?'
  description: Back-to-back LCs (not cancelled, not placeholders) expiring in a date window, earliest first.
  answer_list: 'Back-to-back LCs expiring {window}, earliest first ({n} shown; ask "how many" for the total)'
  match: '(?i)^(?!.*\b(?:most|top|least|per|each|grouped|by\s+(?:supplier|buyer|factory|line|unit|merchandiser|purpose)s?)\b).*?\b(?:back[\s-]*to[\s-]*back|btb|bb\s*lcs?)\b.*\bexpir\w*\b.*\b(today|this week|next week|this month|next month|next \d+ days|last \d+ days)\b'
  params:
    window: { from_group: 1, type: date_window }
  sql: |
    SELECT TOP (200)
      BBLCNo, Supplier, Factory, Purpose, BBLCAmount, Currency, LastShipDate, ExpiryDate
    FROM rag.vw_BackToBackLC
    WHERE ExpiryDate >= @from AND ExpiryDate < @to AND Cancelled = 0 AND Fake = 0
    ORDER BY ExpiryDate, BBLCNo

- name: lcs_expiring_window
  agent: finance_lc
  database: BitopiSplint
  example: 'Which LCs expire next month?'
  follow_ups:
    - 'Which back-to-back LCs expire {window}?'
    - 'How many back-to-back LCs expire {window}?'
  description: Open export (master) LCs and sales contracts whose expiry date, after amendments, falls in a date window.
  answer_list: '{n} open export LC(s) expiring {window}'
  match: '(?i)^(?!.*\b(?:most|top|least|per|each|grouped|by\s+(?:supplier|buyer|factory|line|unit|merchandiser|purpose)s?)\b).*?\b(?:lcs?|letters?\s+of\s+credit|sales\s+contracts?)\b.*\bexpir\w*\b.*\b(today|this week|next week|this month|next month|next \d+ days|last \d+ days)\b'
  params:
    window: { from_group: 1, type: date_window }
  sql: |
    SELECT TOP (200)
      MasterLCRef, Buyer, Factory, LCType, LCAmount, Currency, LastShipDate, ExpiryDate, LCStatus
    FROM rag.vw_ExportLC
    WHERE ExpiryDate >= @from AND ExpiryDate < @to AND LCClosed = 0
    ORDER BY ExpiryDate, MasterLCRef

- name: lines_below_target_by_factory
  agent: production
  database: PlanningTNA
  example: 'Which TAL lines are below target?'
  follow_ups:
    - 'Which lines are below target?'
  description: One factory's sewing lines whose output was below their day target on that factory's latest production day in the data.
  answer_list: '{n} {factory} line(s) below their day target on the latest production day in the data'
  match: '(?i)^(?!.*\b(?:most|top|least|per|each|grouped|by\s+(?:supplier|buyer|factory|line|unit|merchandiser|purpose)s?)\b).*?\b(TAL|RHL|BGL)\b.*\blines?\b.*\b(?:below|under|behind|short\s+of|missed?)\b.*\btargets?\b'
  params:
    factory: { from_group: 1, upper: true }
  sql: |
    SELECT TOP (200)
      ProductionDate, Factory, Unit, LineNumber,
      SUM(DayTarget) AS DayTarget, SUM(OutputPcs) AS OutputPcs, SUM(DayTarget) - SUM(OutputPcs) AS ShortPcs
    FROM rag.vw_LineDailyOutput
    WHERE Factory = @factory
      AND ProductionDate = (SELECT MAX(ProductionDate) FROM rag.vw_LineDailyOutput WHERE Factory = @factory)
    GROUP BY ProductionDate, Factory, Unit, LineNumber
    HAVING SUM(DayTarget) > 0 AND SUM(OutputPcs) < SUM(DayTarget)
    ORDER BY ShortPcs DESC

- name: lines_below_target
  agent: production
  database: PlanningTNA
  example: 'Which lines are below target?'
  follow_ups:
    - 'Which TAL lines are below target?'
    - 'Which RHL lines are below target?'
  description: Sewing lines whose output was below their day target on the latest production day in the data (all factories in scope).
  answer_list: '{n} line(s) below their day target on the latest production day in the data'
  match: '(?i)^(?!.*\b(?:most|top|least|per|each|grouped|by\s+(?:supplier|buyer|factory|line|unit|merchandiser|purpose)s?)\b).*?\blines?\b.*\b(?:below|under|behind|short\s+of|missed?)\b.*\btargets?\b'
  sql: |
    SELECT TOP (200)
      ProductionDate, Factory, Unit, LineNumber,
      SUM(DayTarget) AS DayTarget, SUM(OutputPcs) AS OutputPcs, SUM(DayTarget) - SUM(OutputPcs) AS ShortPcs
    FROM rag.vw_LineDailyOutput
    WHERE ProductionDate = (SELECT MAX(ProductionDate) FROM rag.vw_LineDailyOutput)
    GROUP BY ProductionDate, Factory, Unit, LineNumber
    HAVING SUM(DayTarget) > 0 AND SUM(OutputPcs) < SUM(DayTarget)
    ORDER BY ShortPcs DESC

# "Behind schedule", as a fact the data can show: a confirmed order whose ship date has passed and that
# has no export invoice yet. The order's own ShipmentStatus is not kept up to date (rag.vw_OrderShipment).
# Counts first ("how many"): a list stops at 200 rows, so only a count gives the total.
- name: orders_past_ship_not_invoiced_count
  agent: order
  database: BitopiSplint
  example: 'How many orders are behind schedule?'
  follow_ups:
    - 'Which orders are behind schedule?'
  description: Count of confirmed orders whose ship date passed in the window (default the last 30 days) with no export invoice yet.
  answer: 'Confirmed orders past their ship date ({window}) with no export invoice yet: {value}'
  match: '(?i)^(?!.*\b(?:most|top|least|per|each|grouped|by\s+(?:supplier|buyer|factory|line|unit|merchandiser|purpose)s?)\b).*?\bhow many\b.*\b(?:orders?|eos?)\b.*\b(?:behind\s+schedule|late|overdue|delayed|past\s+(?:their\s+|the\s+)?ship(?:ment)?\s+dates?|missed\s+(?:their\s+|the\s+)?ship(?:ment)?\s+dates?|not\s+(?:yet\s+)?(?:shipped|invoiced))\b(?:.*\b(last \d+ days|this month|this week)\b)?'
  params:
    window: { from_group: 1, type: date_window, default: 'last 30 days' }
  heavy: true
  sql: |
    SELECT COUNT(*) AS Orders
    FROM rag.vw_OrderShipment
    WHERE ShipDate >= @from AND ShipDate < @today AND InvoicedQty IS NULL

- name: orders_past_ship_not_invoiced_by_factory
  agent: order
  database: BitopiSplint
  example: 'Which TAL orders are behind schedule?'
  follow_ups:
    - 'Which orders are behind schedule?'
