  match: '(?i)\bcancel(?:l?ed|lations?)?\b.*\b(today|this week|this month|last \d+ days)\b|\b(today|this week|this month|last \d+ days)\b.*\bcancel(?:l?ed|lations?)?\b'
  params:
    window: { from_group: [1, 2], type: date_window }
  sql: |
