  description: One factory's sewing lines by DHU for a period (default today), live from VistaQ, highest first.
  answer_list: '{factory} lines by DHU (defects per hundred pieces checked) {window}, highest first ({n} lines)'
  match: '(?i)^(?=(?:.*?\b({period})\b)?)(?=.*\b(TAL|RHL|BGL)\b).*(?:\blines?\b.*\b(?:dhu|defects?)\b|\b(?:dhu|defects?)\b.*\blines?\b)'
  unless: *vq_unless
  params:
    window: { from_group: 1, type: date_window, default: 'today' }
    factory: { from_group: 2, upper: true }
  heavy: true
  sql: |
    SELECT TOP (200)
      CASE WHEN MIN(InspectionDate) = MAX(InspectionDate) THEN CAST(MIN(InspectionDate) AS varchar(10))
        ELSE CAST(MIN(InspectionDate) AS varchar(10)) + ' to ' + CAST(MAX(InspectionDate) AS varchar(10)) END AS [Date],
      Factory, Unit, Line, SUM(Checked) AS Checked, SUM(Defects) AS Defects, SUM(Rejected) AS Rejected,
      CAST(100.0 * SUM(Defects) / NULLIF(SUM(Checked), 0) AS decimal(6,2)) AS DHU
