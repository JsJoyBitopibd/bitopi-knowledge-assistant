  description: One factory's QC totals for a period from VistaQ — pieces checked, passed, defective, rejected, defects, DHU, reject %, first-pass % and end-line output.
  answer_list: '{factory} QC summary {window}, live from VistaQ'
  match: '(?i)^(?=(?:.*?\b({period})\b)?)(?=.*\b(TAL|RHL|BGL)\b)(?:(?=.*\b(?:qc|quality|dhu)\s+(?:summary|status|report|overview|position)\b)|(?!.*\b(?:lines?|target|limit|threshold|buyers?|styles?|stages?|capas?|corrective)\b)(?=.*\bdhu\b))'
  unless: *vq_unless
