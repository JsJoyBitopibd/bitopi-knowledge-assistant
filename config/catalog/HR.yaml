# HR: no curated views yet — answered through schema RAG over the discovered tables
# (config/catalog/discovered/HR.json: 267 tables, discovered 2026-10-04).
# Written by scripts/gen_catalog.py; edit the description and keywords freely. `keywords:` are the
# words staff use for this data — the router scores them to pick the database for a question
# (src/ragbot/data/db_router.py). The last 6 were derived from table names.
# `connection_database:` opens this database through the login of `connection_env` (docs/DATA_ACCESS.md §1).
database: HR
description: 'Human resources planning: manpower budgets by position and category, employee matrix, competency and
  assessment records (PMS), KPIs, visitor register, merchandiser and marketing assignments.'
dialect: tsql
# 2026-10-13, the owner opened this database: it answers HR questions, so its business and personal
# columns (salary, attendance, leave, medical, contact, date of birth, NID, bank) are readable.
# Only credentials stay blocked. Deleting this line closes the database again (Phase R).
sensitive_patterns: [password, pwd, token, secret]
connection_env: SQLSERVER_CONN_PRODUCTION
connection_database: HR
keywords:
- hr
- human resources
- manpower
- headcount
- head count
- employee
- employees
- staff
- position
- positions
- designation
- competency
- competencies
- assessment
- appraisal
- kpi
- kpis
- pms
- performance
- visitor
- visitors
- skill
- skills
- matrix
- organogram
- merchandiser
- supervisor
- vacancy
- vacancies
- budgeted
- budget
- information
- plan
- marketing
- role
- final
# Phase R: the pay and people words gen_catalog.py strips when it writes keywords.
- salary
- salaries
- mobile bill
- blood group
- religion
- date of birth
- contact number
- applicant
- recruitment
table_notes:
  # Phase R. HR is the planning database: manpower budget, PMS competency and assessment, the visitor
  # register and employee master copies. Attendance, leave and payroll live in Hrms5Misami.
  dbo.Employee_Information: >-
    an employee master copy (21,718) with the personal fields — email, date of birth, religion, blood group,
    present and permanent address, bank account and mobile. Hrms5Misami.dbo.tblEmployee is the live master.
  dbo.EmployeeProfile: >-
    a second employee master copy (13,191) with date of birth, addresses, bank, blood group, religion and
    entry salary. Prefer Hrms5Misami for anything current.
  dbo.ManpowerBudget_Employee_Salary: >-
    the salary line of the manpower budget, one row per budgeted employee (12,733) — budget figures, not
    what was paid; the paid amounts are in Hrms5Misami.
  dbo.ManpowerBudget_Employee_Budget: one row per employee and budget code (78,745) — the manpower budget itself.
  dbo.Category_Wise_Manpower: manpower totals per company, unit, category and date (70,490).
  dbo.VisitorInformation: >-
    the visitor register (64,558). DateAdded is NULL in every row, so visitor questions cannot be answered
    by date (reported to the data owners on 2026-10-06).
  PMS.CompetencyInformation: PMS competency scores per quarter; PMS.AssesmentInformation holds the assessments.
synonyms:
  manpower: [headcount, head count, budgeted employee]
  salary: [pay, gross, basic]
exclude_tables:
- '*back'
- '*back_*'
- '*backup*'
- '*_bak*'
- '*bak_*'
- '*$'
- '*$'''
- '*$_*'
- '*_old*'
- '*.tmp*'
- '*.temp_*'
- '*_temp'
- '*_test*'
- '*.test_*'
- '*daytest'
- '*delete*'
- '*_mail_on_*'
- '*_before_*'
- '*_till*'
- '*_[0-9]_*'
- '*_[0-9][0-9]_*'
- '*_[0-9][0-9][0-9][0-9]*'
- '*.backfill_*'
- '*.shadow_*'
- '*.baseline_*'
- '*._linechange_*'
rules:
- Use TOP (n), never LIMIT. Use half-open date ranges with literal dates (col >= '2026-09-01' AND col < '2026-10-01').
- Today is {today}. "This week" = Monday of this week to next Monday; "next week" = next Monday to the following
  Monday.
- 'This database has no rag.* views: query the tables listed for the question as schema.name and name the columns
  you need (never SELECT *).'
- Do NOT compute totals in prose; return the rows or an aggregate (COUNT/SUM in the SQL).
- Never join to tables outside the catalog. If a question needs a column that is not listed here, return "System
  doesn't have the data."
views: []
