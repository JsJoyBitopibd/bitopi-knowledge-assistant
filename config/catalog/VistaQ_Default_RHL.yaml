hints:
  - column: WorkspaceLineId
    target: dbo.Workspace.Id
    note: "the sewing line; its name is dbo.Workspace.WorkspaceName"
    tables: [dbo.QCSummary, dbo.DefectSummary, dbo.QualityInspection, dbo.ProductionPlan]
  - column: WorkspaceUnitId
    target: dbo.Workspace.Id
    note: "the unit; its name is dbo.Workspace.WorkspaceName"
    tables: [dbo.QCSummary, dbo.DefectSummary, dbo.QualityInspection, dbo.ProductionPlan]
  - column: BuyerId
    target: dbo.Buyer.Id
    note: "the buyer; its name is dbo.Buyer.BuyerName"
    tables: [dbo.QCSummary, dbo.DefectSummary, dbo.ProductionPlan, dbo.Style]
  - column: StyleId
    target: dbo.Style.Id
    note: "the style; dbo.Style.StyleNumber and StyleName"
    tables: [dbo.QCSummary, dbo.DefectSummary, dbo.ProductionPlan]
  - column: DefectId
    target: dbo.Defect.Id
    note: "the defect; its name is dbo.Defect.DefectName"
    tables: [dbo.DefectSummary, dbo.QualityInspectionDefect]
