# VistaQ_Default_RHL: the VistaQ quality and production system on 192.168.10.59 (server VISTAQ). Despite its name it
# holds all three factories (RHL, TAL, BGL): factory = line -> unit (ParentId) -> factory (ParentId) in dbo.Workspace.
# Discovered 2026-10-07 (config/catalog/discovered/VistaQ_Default_RHL.json: 91 tables). The rag.* views below are
# virtual (`definition:`, data/virtual.py), checked on live data on 2026-10-07: every one answers a one-day question
# in under a second because the date filter reaches the date-only indexes (InspectionDateOnly,
# InspectionDefectDateOnly). Meaning of the codes, verified against VistaQ's own figures:
#   InspectionType 1 = passed first time, 2 = defective (sent for repair; every defect row hangs on one),
#   3 = re-check after repair, 4 = rejected (matches dbo.QualityInspectionReject).
#   DHU = defects / pieces checked first time (types 1, 2, 4, all QC stages) x 100 — reproduces the DHU VistaQ stores
#   on dbo.CorrectiveAction (e.g. 81 / 2,666 = 3.04).
#   QC stages: Front/Back QC, Waist QC, Station-03, Output QC (end of line); end-line output = IsEndlinePassed.
# dbo.DefectSummary / dbo.QCSummary are filled by a job that runs behind (29 Sep / 5 Oct on 7 Oct 2026): not used.
# Factory is computed after the joins on purpose (MAX(...) after GROUP BY line, or CASE WHEN l.Id = <line id>):
# a plain f.ShortName lets SQL Server push "Factory = 'TAL'" (a fixed tool, a user's scope, model-written SQL) into
# dbo.Workspace and read every inspection of that factory's lines before the date filter. Measured 7 Oct 2026, one
# factory for today: 4-6 s -> 0.2-0.3 s (line quality), 1.4-2 s -> 0.2 s (defects), same totals.
database: VistaQ_Default_RHL
label: VistaQ
description: 'VistaQ quality and production for RHL, TAL and BGL, live: pieces checked, passed, defective and
  rejected per sewing line and QC stage, every defect found (type, stage, buyer, style, PO), DHU, reject % and
  first-pass %, end-line output, corrective actions (CAPA) and daily cutting output.'
dialect: tsql
connection_env: SQLSERVER_CONN_VISTAQ
connection_database: VistaQ_Default_RHL
keywords:
- vistaq
- vista q
- dhu
- defects
- defect summary
- defect type
- defect types
- top defects
- qc
- qc summary
- quality summary
- quality inspection
- quality inspections
- inspections
- end line
- endline
- end-line
- end line output
- line output
- first pass
- ftp
- reject
- rejects
- rejection
- reject rate
- alter
- alteration
- repair
- corrective action
- corrective actions
- capa
- root cause
- cutting output
- cut quantity
- defect
- inspection
hints:
  - column: WorkspaceLineId
    target: dbo.Workspace.Id
    note: "the sewing line; its name is dbo.Workspace.WorkspaceName (unit = its ParentId, factory = the unit's ParentId)"
    tables: [dbo.QCSummary, dbo.DefectSummary, dbo.QualityInspection, dbo.ProductionPlan]
  - column: BuyerId
    target: dbo.Buyer.Id
    note: "the buyer; its name is dbo.Buyer.BuyerName"
    tables: [dbo.QCSummary, dbo.DefectSummary, dbo.ProductionPlan, dbo.Style]
  - column: StyleId
    target: dbo.Style.Id
    note: "the style; dbo.Style.StyleNumber and StyleName"
    tables: [dbo.QCSummary, dbo.DefectSummary, dbo.ProductionPlan]
  - column: DefectId
    target: dbo.Defect.Id
    note: "the defect; its name is dbo.Defect.DefectName"
    tables: [dbo.DefectSummary, dbo.QualityInspectionDefect]
exclude_tables:
- '*back'
- '*back_*'
- '*backup*'
- '*_bak*'
- '*bak_*'
- '*$'
- '*$'''
- '*$_*'
- '*_old*'
- '*.tmp*'
- '*.temp_*'
- '*_temp'
- '*_test*'
- '*.test_*'
- '*daytest'
- '*delete*'
- '*_mail_on_*'
- '*_before_*'
- '*_till*'
- '*_[0-9]_*'
- '*_[0-9][0-9]_*'
- '*_[0-9][0-9][0-9][0-9]*'
- '*.backfill_*'
- '*.shadow_*'
- '*.baseline_*'
- '*._linechange_*'
- 'dbo.QCSummary'
- 'dbo.DefectSummary'
rules:
- Use TOP (n), never LIMIT. Use half-open date ranges with literal dates (col >= '2026-09-01' AND col < '2026-10-01').
- Today is {today}. "This week" = Monday of this week to next Monday; "last week" = the Monday before to this Monday.
- 'Use the rag views: rag.vw_LineDayQuality (per factory, line and day: Checked, Passed, DefectivePcs, Rejected,
  Defects, DHU, RejectPct, FirstPassPct, EndlineOutput), rag.vw_QCDefect (one row per defect found),
  rag.vw_QCStageDay (per QC stage), rag.vw_CorrectiveAction, rag.vw_CuttingDaily, rag.vw_QCTarget. Always filter on
  the view''s date column.'
- 'Over several lines or days, recompute ratios from the sums: DHU = 100.0 * SUM(Defects) / SUM(Checked);
  RejectPct = 100.0 * SUM(Rejected) / SUM(Checked); FirstPassPct = 100.0 * SUM(Passed) / SUM(Checked). Never average
  the DHU column.'
- A line is named by Factory and Line together (line numbers are per factory).
- Do NOT compute totals in prose; return the rows or an aggregate (COUNT/SUM in the SQL).
- Never join to tables outside the catalog. If a question needs a column that is not listed here, return "System
  doesn't have the data."
views:
  - name: rag.vw_LineDayQuality
    scope_column: Factory
    grain: one row per factory, sewing line and inspection day (all QC stages together)
    description: >
      Sewing-line quality per day from VistaQ, live: pieces checked first time (passed + defective + rejected),
      passed first time, defective pieces, rejected pieces, defects found, end-line output, and DHU, reject % and
      first-pass % for that line and day.
    key_columns: [Factory, Line, InspectionDate]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line number
      InspectionDate: inspection day
      Checked: pieces checked the first time (passed + defective + rejected)
      Passed: pieces passed the first time
      DefectivePcs: pieces found defective and sent for repair
      Rejected: pieces rejected
      Rectified: defective pieces repaired and passed on re-check
      EndlineOutput: pieces passed at end-line (Output QC) — the line's output
      Defects: defects found
      DHU: defects per hundred pieces checked
      RejectPct: rejected pieces per hundred checked
      FirstPassPct: pieces passed first time per hundred checked
    definition: |
      SELECT
        MAX(f.ShortName) AS Factory, MAX(u.WorkspaceName) AS Unit, MAX(l.WorkspaceName) AS Line, x.InspectionDate,
        SUM(x.Checked) AS Checked, SUM(x.Passed) AS Passed, SUM(x.DefectivePcs) AS DefectivePcs,
        SUM(x.Rejected) AS Rejected, SUM(x.Rectified) AS Rectified, SUM(x.Output) AS EndlineOutput, SUM(x.Defects) AS Defects,
        CAST(100.0 * SUM(x.Defects) / NULLIF(SUM(x.Checked), 0) AS decimal(6,2)) AS DHU,
        CAST(100.0 * SUM(x.Rejected) / NULLIF(SUM(x.Checked), 0) AS decimal(6,2)) AS RejectPct,
        CAST(100.0 * SUM(x.Passed) / NULLIF(SUM(x.Checked), 0) AS decimal(6,2)) AS FirstPassPct
      FROM (
        SELECT qi.WorkspaceLineId, qi.InspectionDateOnly AS InspectionDate,
          CASE WHEN qi.InspectionType IN (1, 2, 4) THEN qi.Quantity ELSE 0 END AS Checked,
          CASE WHEN qi.InspectionType = 1 THEN qi.Quantity ELSE 0 END AS Passed,
          CASE WHEN qi.InspectionType = 2 THEN qi.Quantity ELSE 0 END AS DefectivePcs,
          CASE WHEN qi.InspectionType = 4 THEN qi.Quantity ELSE 0 END AS Rejected,
          CASE WHEN qi.InspectionType = 3 THEN qi.Quantity ELSE 0 END AS Rectified,
          CASE WHEN qi.IsEndlinePassed = 1 THEN qi.Quantity ELSE 0 END AS Output,
          0 AS Defects
        FROM dbo.QualityInspection qi
        UNION ALL
        SELECT qi.WorkspaceLineId, d.InspectionDefectDateOnly, 0, 0, 0, 0, 0, 0, 1
        FROM dbo.QualityInspectionDefect d
        JOIN dbo.QualityInspection qi ON qi.Id = d.QualityInspectionId
      ) AS x
      LEFT JOIN dbo.Workspace l ON l.Id = x.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId
      GROUP BY x.WorkspaceLineId, x.InspectionDate

  - name: rag.vw_QCDefect
    scope_column: Factory
    grain: one row per defect found at a QC point
    description: >
      Every defect VistaQ recorded, live: the day, factory, unit, line, QC stage, buyer, style, PO, colour, defect
      type, its category (Critical / Major / Minor) and the sewing process it came from. COUNT(*) = number of defects.
    key_columns: [Factory, Line, DefectDate, Defect]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line number
      DefectDate: day the defect was found
      Stage: QC point (Front/ Back QC, Waist QC, Station-03, Output QC)
      Buyer: buyer name
      Style: style number
      PO: buyer's purchase order number
      Color: garment colour
      Defect: defect type, e.g. Skip Stitch, Pleat
      DefectCategory: Critical, Major or Minor
      Process: sewing process where the defect was made
    definition: |
      SELECT
        CASE WHEN l.Id = qi.WorkspaceLineId THEN f.ShortName END AS Factory, u.WorkspaceName AS Unit, l.WorkspaceName AS Line, d.InspectionDefectDateOnly AS DefectDate,
        st.StageName AS Stage, b.BuyerName AS Buyer, s.StyleNumber AS Style, pp.PO, pp.ColorName AS Color,
        df.DefectName AS Defect, dc.DefectCategoryName AS DefectCategory, p.ProcessName AS Process
      FROM dbo.QualityInspectionDefect d
      JOIN dbo.QualityInspection qi ON qi.Id = d.QualityInspectionId
      LEFT JOIN dbo.ProductionPlan pp ON pp.Id = qi.ProductionPlanId
      LEFT JOIN dbo.Buyer b ON b.Id = pp.BuyerId
      LEFT JOIN dbo.Style s ON s.Id = pp.StyleId
      LEFT JOIN dbo.Defect df ON df.Id = d.DefectId
      LEFT JOIN dbo.DefectCategory dc ON dc.Id = df.DefectCategoryId
      LEFT JOIN dbo.Process p ON p.Id = d.ProcessId
      LEFT JOIN dbo.SectionWorkflowStage st ON st.Id = qi.StageId
      LEFT JOIN dbo.Workspace l ON l.Id = qi.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId

  - name: rag.vw_QCStageDay
    scope_column: Factory
    grain: one row per factory, line, inspection day and QC stage
    description: >
      Pieces checked, passed, defective, rejected, re-checked after repair and passed at end-line, per QC stage, line
      and day, live from VistaQ.
    key_columns: [Factory, Line, InspectionDate, Stage]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line number
      InspectionDate: inspection day
      Stage: QC point (Front/ Back QC, Waist QC, Station-03, Output QC)
      Checked: pieces checked the first time at this stage
      Passed: pieces passed the first time
      DefectivePcs: pieces found defective
      Rejected: pieces rejected
      RepairedPassed: repaired pieces passed on re-check
      EndlinePassed: pieces passed at end-line (Output QC only)
    definition: |
      SELECT
        CASE WHEN l.Id = q.WorkspaceLineId THEN f.ShortName END AS Factory, u.WorkspaceName AS Unit, l.WorkspaceName AS Line, q.InspectionDate, st.StageName AS Stage,
        q.Checked, q.Passed, q.DefectivePcs, q.Rejected, q.RepairedPassed, q.EndlinePassed
      FROM (
        SELECT WorkspaceLineId, InspectionDateOnly AS InspectionDate, StageId,
          SUM(CASE WHEN InspectionType IN (1, 2, 4) THEN Quantity ELSE 0 END) AS Checked,
          SUM(CASE WHEN InspectionType = 1 THEN Quantity ELSE 0 END) AS Passed,
          SUM(CASE WHEN InspectionType = 2 THEN Quantity ELSE 0 END) AS DefectivePcs,
          SUM(CASE WHEN InspectionType = 4 THEN Quantity ELSE 0 END) AS Rejected,
          SUM(CASE WHEN InspectionType = 3 THEN Quantity ELSE 0 END) AS RepairedPassed,
          SUM(CASE WHEN IsEndlinePassed = 1 THEN Quantity ELSE 0 END) AS EndlinePassed
        FROM dbo.QualityInspection
        GROUP BY WorkspaceLineId, InspectionDateOnly, StageId
      ) AS q
      LEFT JOIN dbo.SectionWorkflowStage st ON st.Id = q.StageId
      LEFT JOIN dbo.Workspace l ON l.Id = q.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId

  - name: rag.vw_CorrectiveAction
    scope_column: Factory
    grain: one row per corrective action (CAPA) raised in VistaQ
    description: >
      Corrective actions VistaQ raised for a line, style and defect: the day raised, deadline, buyer, style, defect,
      the number of defects and the DHU that triggered it, the DHU reduction target and the status code as stored
      (1 for almost all; the meaning of 2 and 3 is not documented in the data).
    key_columns: [Factory, Line, CAPDate, Defect]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line number
      CAPDate: day the corrective action was raised
      Deadline: deadline
      Buyer: buyer name
      Style: style number
      Defect: defect type it addresses
      NumberOfDefect: defects of that type that triggered it
      DHU: DHU that triggered it
      DHUReductionTarget: DHU reduction target
      Status: status code as stored (1, 2 or 3)
    definition: |
      SELECT
        CASE WHEN l.Id = ca.WorkspaceLineId THEN f.ShortName END AS Factory, u.WorkspaceName AS Unit, l.WorkspaceName AS Line, CAST(ca.CAPDate AS date) AS CAPDate,
        CAST(ca.Deadline AS date) AS Deadline, b.BuyerName AS Buyer, s.StyleNumber AS Style, df.DefectName AS Defect,
        ca.NumberOfDefect, ca.DHU, ca.DHUReductionTarget, ca.Status
      FROM dbo.CorrectiveAction ca
      LEFT JOIN dbo.Workspace l ON l.Id = ca.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId
      LEFT JOIN dbo.Buyer b ON b.Id = ca.BuyerId
      LEFT JOIN dbo.Style s ON s.Id = ca.StyleId
      LEFT JOIN dbo.Defect df ON df.Id = ca.DefectId

  - name: rag.vw_CuttingDaily
    scope_column: Factory
    grain: one row per factory, line, day, buyer, style and PO cut
    description: >
      Pieces cut per day from VistaQ, live, by the sewing line they are planned for, with buyer, style and PO.
    key_columns: [Factory, Line, CuttingDate, Style, PO]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line the cut pieces are planned for
      CuttingDate: cutting day
      Buyer: buyer name
      Style: style number
      PO: buyer's purchase order number
      CutQty: pieces cut
    definition: |
      SELECT
        CASE WHEN l.Id = c.WorkspaceLineId THEN f.ShortName END AS Factory, u.WorkspaceName AS Unit, l.WorkspaceName AS Line, c.CuttingDate,
        b.BuyerName AS Buyer, s.StyleNumber AS Style, c.PO, c.CutQty
      FROM (
        SELECT pp.WorkspaceLineId, pp.BuyerId, pp.StyleId, pp.PO, CAST(co.CuttingDate AS date) AS CuttingDate,
          SUM(co.Quantity) AS CutQty
        FROM dbo.CuttingOutput co
        JOIN dbo.ProductionPlan pp ON pp.Id = co.ProductionPlanId
        GROUP BY pp.WorkspaceLineId, pp.BuyerId, pp.StyleId, pp.PO, CAST(co.CuttingDate AS date)
      ) AS c
      LEFT JOIN dbo.Buyer b ON b.Id = c.BuyerId
      LEFT JOIN dbo.Style s ON s.Id = c.StyleId
      LEFT JOIN dbo.Workspace l ON l.Id = c.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId

  - name: rag.vw_QCTarget
    scope_column: Factory
    grain: one row per factory and target setting in VistaQ (the latest applies)
    description: >
      Quality targets set in VistaQ: the DHU target, the reject-rate target and the efficiency target, from the day
      they apply. VistaQ keeps one setting for all factories; it is repeated per factory so every user sees it.
    key_columns: [Factory, EffectiveFrom]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      EffectiveFrom: first day the targets apply
      DHUTarget: DHU target (defects per hundred pieces checked)
      RejectPctTarget: reject-rate target, percent
      EfficiencyTarget: line efficiency target, percent
    definition: |
      SELECT f.ShortName AS Factory, CAST(t.EffectiveFrom AS date) AS EffectiveFrom, t.DHUThreshold AS DHUTarget,
        t.RejectRateThreshold AS RejectPctTarget, t.EfficiencyThreshold AS EfficiencyTarget
      FROM dbo.Threshold t
      CROSS JOIN dbo.Workspace f
      WHERE f.WorkspaceLevel = 1 AND f.ShortName IS NOT NULL
  # ---- production (VistaQ's dashboard: planned, output, man hours, SAH, efficiency, WIP) ----
  - name: rag.vw_PlanDay
    scope_column: Factory
    grain: one row per production plan and plan day (a line's style for that day)
    description: >
      VistaQ's daily production plans per line and style: SMV, planned manpower (operators + helpers + ironmen),
      planned working hours, day target and plan efficiency. A plan with PlanHours 0 is a style no longer running that
      day (its DayTarget is 0); planned production is SUM(DayTarget).
    key_columns: [Factory, Line, PlanDate, Style]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line number
      PlanDate: day the plan is for
      Buyer: buyer name
      Style: style number
      SMV: standard minutes per piece
      Manpower: planned operators + helpers + ironmen
      PlanHours: planned working hours (0 = the style is not running that day)
      DayTarget: planned pieces for the day
      PlanEfficiency: planned efficiency, percent
      Combination: VistaQ's plan combination code (one style/PO/colour on one line, kept across days)
    definition: |
      SELECT
        CASE WHEN l.Id = p.WorkspaceLineId THEN f.ShortName END AS Factory, u.WorkspaceName AS Unit,
        l.WorkspaceName AS Line, CAST(p.PlanDate AS date) AS PlanDate, b.BuyerName AS Buyer, s.StyleNumber AS Style,
        p.SMV, ISNULL(p.Operator, 0) + ISNULL(p.Helper, 0) + ISNULL(p.IronMan, 0) AS Manpower,
        ISNULL(p.WorkingHours, 0) AS PlanHours, ISNULL(p.DayTarget, 0) AS DayTarget, p.PlanEfficiency,
        p.PlanCombinationKey AS Combination
      FROM dbo.ProductionPlan p
      LEFT JOIN dbo.Buyer b ON b.Id = p.BuyerId
      LEFT JOIN dbo.Style s ON s.Id = p.StyleId
      LEFT JOIN dbo.Workspace l ON l.Id = p.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId
      WHERE p.IsActive = 1

  - name: rag.vw_PlanOutputDay
    scope_column: Factory
    grain: one row per line, production plan and day with end-line output
    description: >
      End-line output (pieces passed at Output QC, first time or after repair) per line, plan and day, live from
      VistaQ, with the plan's SMV and the standard allowed hours earned (SAH = OutputPcs x SMV / 60).
    key_columns: [Factory, Line, OutputDate, Style]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line number
      OutputDate: day of the output
      Style: style number
      SMV: standard minutes per piece (from the plan)
      OutputPcs: pieces passed at end-line
      SAH: standard allowed hours earned (OutputPcs x SMV / 60)
      Combination: VistaQ's plan combination code
    definition: |
      SELECT
        CASE WHEN l.Id = o.WorkspaceLineId THEN f.ShortName END AS Factory, u.WorkspaceName AS Unit,
        l.WorkspaceName AS Line, o.OutputDate, s.StyleNumber AS Style, p.SMV, o.Output AS OutputPcs,
        CAST(o.Output * ISNULL(p.SMV, 0) / 60.0 AS decimal(12,2)) AS SAH, p.PlanCombinationKey AS Combination
      FROM (
        SELECT qi.InspectionDateOnly AS OutputDate, qi.WorkspaceLineId, qi.ProductionPlanId, SUM(qi.Quantity) AS Output
        FROM dbo.QualityInspection qi
        WHERE qi.IsEndlinePassed = 1
        GROUP BY qi.InspectionDateOnly, qi.WorkspaceLineId, qi.ProductionPlanId
      ) AS o
      LEFT JOIN dbo.ProductionPlan p ON p.Id = o.ProductionPlanId
      LEFT JOIN dbo.Style s ON s.Id = p.StyleId
      LEFT JOIN dbo.Workspace l ON l.Id = o.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId

  - name: rag.vw_LineDayManHours
    scope_column: Factory
    grain: one row per line and working day
    description: >
      Each line's working day from VistaQ's session plan: working hours (breaks excluded), hours worked so far (the
      whole day for a past day) and man hours, counting the manpower in place in each working slot (VistaQ's
      manpower amendments, else the plan's operators + helpers + ironmen).
    key_columns: [Factory, Line, WorkDate]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line number
      WorkDate: working day
      SessionHours: working hours in the day's session plan (breaks excluded)
      WorkedHours: working hours elapsed so far (equals SessionHours for a past day)
      ManHours: man hours worked so far (manpower in place x hours, per working slot)
      PlanManpower: planned operators + helpers + ironmen
    definition: |
      SELECT
        MAX(CASE WHEN l.Id = x.WorkspaceLineId THEN f.ShortName END) AS Factory, MAX(u.WorkspaceName) AS Unit,
        MAX(l.WorkspaceName) AS Line, x.WorkDate,
        CAST(SUM(x.Hours) AS decimal(6,2)) AS SessionHours, CAST(SUM(x.Elapsed) AS decimal(6,2)) AS WorkedHours,
        CAST(SUM(x.Elapsed * x.Manpower) AS decimal(12,2)) AS ManHours, MAX(x.PlanManpower) AS PlanManpower
      FROM (
        SELECT s.WorkspaceLineId, CAST(s.ProductionPlanDate AS date) AS WorkDate,
          DATEDIFF(minute, d.StartTime, d.EndTime) / 60.0 AS Hours,
          CASE WHEN CAST(s.ProductionPlanDate AS date) < CAST(GETDATE() AS date)
                 THEN DATEDIFF(minute, d.StartTime, d.EndTime) / 60.0
               WHEN CAST(s.ProductionPlanDate AS date) > CAST(GETDATE() AS date) OR CAST(GETDATE() AS time) <= d.StartTime
                 THEN 0
               WHEN CAST(GETDATE() AS time) >= d.EndTime THEN DATEDIFF(minute, d.StartTime, d.EndTime) / 60.0
               ELSE DATEDIFF(minute, d.StartTime, CAST(GETDATE() AS time)) / 60.0 END AS Elapsed,
          COALESCE(a.Manpower, pm.Manpower, 0) AS Manpower, pm.Manpower AS PlanManpower
        FROM dbo.LineWiseSessionPlan s
        JOIN dbo.LineWiseSessionPlanDetail d ON d.LineWiseSessionPlanId = s.Id AND d.SessionType IN (1, 4, 5)
        LEFT JOIN (
          SELECT WorkspaceLineId, CAST(PlanDate AS date) AS PlanDate,
            MAX(ISNULL(Operator, 0) + ISNULL(Helper, 0) + ISNULL(IronMan, 0)) AS Manpower
          FROM dbo.ProductionPlan
          WHERE IsActive = 1 AND WorkingHours > 0
          GROUP BY WorkspaceLineId, CAST(PlanDate AS date)
        ) AS pm ON pm.WorkspaceLineId = s.WorkspaceLineId AND pm.PlanDate = CAST(s.ProductionPlanDate AS date)
        LEFT JOIN (
          SELECT d2.Id AS DetailId, CAST(s2.ProductionPlanDate AS date) AS WorkDate,
            ISNULL(m.Operator, 0) + ISNULL(m.Helper, 0) + ISNULL(m.IronMan, 0) AS Manpower,
            ROW_NUMBER() OVER (PARTITION BY CAST(s2.ProductionPlanDate AS date), d2.Id
                               ORDER BY m.AmendmentTime DESC, m.Id DESC) AS rn
          FROM dbo.LineWiseSessionPlanDetail d2
          JOIN dbo.LineWiseSessionPlan s2 ON s2.Id = d2.LineWiseSessionPlanId
          JOIN dbo.ManpowerAmendment m ON m.WorkspaceLineId = s2.WorkspaceLineId
            AND m.AmendmentDate = s2.ProductionPlanDate AND m.IsActive = 1 AND m.AmendmentTime <= d2.StartTime
        ) AS a ON a.DetailId = d.Id AND a.WorkDate = CAST(s.ProductionPlanDate AS date) AND a.rn = 1
      ) AS x
      LEFT JOIN dbo.Workspace l ON l.Id = x.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId
      GROUP BY x.WorkspaceLineId, x.WorkDate

  - name: rag.vw_CombinationFlowDay
    scope_column: Factory
    grain: one row per plan combination, flow and day (cutting input or end-line output)
    description: >
      Pieces flowing through each plan combination (one style/PO/colour on one line) per day: cut pieces sent to
      the line (input) and pieces passed at end-line (output). WIP of a combination up to a day = SUM(CutQty) -
      SUM(OutputQty) over all its days up to then.
    key_columns: [Factory, Line, Combination, FlowDate]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Line: sewing line number
      Combination: VistaQ's plan combination code
      FlowDate: day of the flow
      CutQty: cut pieces sent to the line that day
      OutputQty: pieces passed at end-line that day
    definition: |
      SELECT
        CASE WHEN l.Id = x.WorkspaceLineId THEN f.ShortName END AS Factory, l.WorkspaceName AS Line,
        x.Combination, x.FlowDate, x.CutQty, x.OutputQty
      FROM (
        SELECT p.WorkspaceLineId, c.Combination, c.FlowDate, c.CutQty, 0 AS OutputQty
        FROM (
          SELECT co.ProductionPlanId, co.PlanCombinationKey AS Combination, CAST(co.CuttingDate AS date) AS FlowDate,
            SUM(co.Quantity) AS CutQty
          FROM dbo.CuttingOutput co
          GROUP BY co.ProductionPlanId, co.PlanCombinationKey, CAST(co.CuttingDate AS date)
        ) AS c
        JOIN dbo.ProductionPlan p ON p.Id = c.ProductionPlanId
        UNION ALL
        SELECT qi.WorkspaceLineId, qi.PlanCombinationKey, qi.InspectionDateOnly, 0, SUM(qi.Quantity)
        FROM dbo.QualityInspection qi
        WHERE qi.IsEndlinePassed = 1
        GROUP BY qi.WorkspaceLineId, qi.PlanCombinationKey, qi.InspectionDateOnly
      ) AS x
      LEFT JOIN dbo.Workspace l ON l.Id = x.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId

  - name: rag.vw_PlanQualityDay
    scope_column: Factory
    grain: one row per factory, sewing line, inspection day and production plan (buyer, style, colour, file)
    description: >
      Sewing-line quality per day and production plan from VistaQ, live: the same counts as rag.vw_LineDayQuality
      split by the plan's buyer, style, colour and file (FR number = the ERP's FileRefID). VistaQ records QC per file,
      style and colour, not per PO or export order (EO): its PO is "TBA"; a file holds many EOs and POs.
    key_columns: [Factory, Line, InspectionDate, Buyer, Style, Color, FileNo]
    columns:
      Factory: factory short name (RHL, TAL, BGL)
      Unit: unit or block of the line
      Line: sewing line number
      InspectionDate: inspection day
      Buyer: buyer name
      Style: style number
      Color: colour name
      FileNo: order file (FR number, e.g. FR-26-1985) = the ERP's FileRefID; its export orders and POs are in the ERP
      Checked: pieces checked the first time (passed + defective + rejected)
      Passed: pieces passed the first time (FTP)
      DefectivePcs: pieces found defective and sent for repair
      Rectified: defective pieces repaired and passed on re-check
      Rejected: pieces rejected
      EndlineOutput: pieces passed at end-line (Output QC)
      Defects: defects found
    definition: |
      SELECT
        CASE WHEN l.Id = x.WorkspaceLineId THEN f.ShortName END AS Factory, u.WorkspaceName AS Unit,
        l.WorkspaceName AS Line, x.InspectionDate, b.BuyerName AS Buyer, s.StyleNumber AS Style,
        p.ColorName AS Color, p.FileId AS FileNo,
        x.Checked, x.Passed, x.DefectivePcs, x.Rectified, x.Rejected, x.EndlineOutput, x.Defects
      FROM (
        SELECT y.WorkspaceLineId, y.InspectionDate, y.ProductionPlanId,
          SUM(y.Checked) AS Checked, SUM(y.Passed) AS Passed, SUM(y.DefectivePcs) AS DefectivePcs,
          SUM(y.Rectified) AS Rectified, SUM(y.Rejected) AS Rejected, SUM(y.Pcs) AS EndlineOutput,
          SUM(y.Defects) AS Defects
        FROM (
          SELECT qi.WorkspaceLineId, qi.InspectionDateOnly AS InspectionDate, qi.ProductionPlanId,
            CASE WHEN qi.InspectionType IN (1, 2, 4) THEN qi.Quantity ELSE 0 END AS Checked,
            CASE WHEN qi.InspectionType = 1 THEN qi.Quantity ELSE 0 END AS Passed,
            CASE WHEN qi.InspectionType = 2 THEN qi.Quantity ELSE 0 END AS DefectivePcs,
            CASE WHEN qi.InspectionType = 3 THEN qi.Quantity ELSE 0 END AS Rectified,
            CASE WHEN qi.InspectionType = 4 THEN qi.Quantity ELSE 0 END AS Rejected,
            CASE WHEN qi.IsEndlinePassed = 1 THEN qi.Quantity ELSE 0 END AS Pcs,
            0 AS Defects
          FROM dbo.QualityInspection qi
          UNION ALL
          SELECT qi.WorkspaceLineId, d.InspectionDefectDateOnly, qi.ProductionPlanId, 0, 0, 0, 0, 0, 0, 1
          FROM dbo.QualityInspectionDefect d
          JOIN dbo.QualityInspection qi ON qi.Id = d.QualityInspectionId
        ) AS y
        GROUP BY y.WorkspaceLineId, y.InspectionDate, y.ProductionPlanId
      ) AS x
      LEFT JOIN dbo.ProductionPlan p ON p.Id = x.ProductionPlanId
      LEFT JOIN dbo.Buyer b ON b.Id = p.BuyerId
      LEFT JOIN dbo.Style s ON s.Id = p.StyleId
      LEFT JOIN dbo.Workspace l ON l.Id = x.WorkspaceLineId
      LEFT JOIN dbo.Workspace u ON u.Id = l.ParentId
      LEFT JOIN dbo.Workspace f ON f.Id = u.ParentId

examples:
  - question: What was the DHU of each factory yesterday?
    sql: |
      SELECT TOP (10) Factory, SUM(Checked) AS Checked, SUM(Defects) AS Defects,
        CAST(100.0 * SUM(Defects) / NULLIF(SUM(Checked), 0) AS decimal(6,2)) AS DHU
      FROM rag.vw_LineDayQuality
      WHERE InspectionDate >= '2026-10-06' AND InspectionDate < '2026-10-07'
      GROUP BY Factory
      ORDER BY DHU DESC
  - question: Which styles had the most defects at RHL this week?
    sql: |
      SELECT TOP (20) Buyer, Style, COUNT(*) AS Defects
      FROM rag.vw_QCDefect
      WHERE Factory = 'RHL' AND DefectDate >= '2026-10-05' AND DefectDate < '2026-10-12'
      GROUP BY Buyer, Style
      ORDER BY Defects DESC
  - question: Which critical defects were found today?
    sql: |
      SELECT TOP (50) Factory, Line, Defect, COUNT(*) AS Defects
      FROM rag.vw_QCDefect
      WHERE DefectCategory = 'Critical' AND DefectDate >= '2026-10-07' AND DefectDate < '2026-10-08'
      GROUP BY Factory, Line, Defect
      ORDER BY Defects DESC
