database: VistaQ_Default_RHL
description: 'RHL factory quality and production in VistaQ: end-of-line QC inspections and defects (DHU), daily
  QC and defect summaries by line, style and buyer, sewing production plans and line session plans, cutting output
  and bundles, manpower changes, corrective actions (CAPA) and root causes.'
factory: RHL          # this server holds RHL data only (data/db_router.py: preferred for RHL questions, not for other factories)
dialect: tsql
connection_env: SQLSERVER_CONN_VISTAQ
connection_database: VistaQ_Default_RHL
