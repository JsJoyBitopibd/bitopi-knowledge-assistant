rules:
- Use TOP (n), never LIMIT. Use half-open date ranges with literal dates (col >= '2026-09-01' AND col < '2026-10-01').
- Today is {today}. "This week" = Monday of this week to next Monday; "next week" = next Monday to the following
  Monday.
- 'This database has no rag.* views: query the tables listed for the question as schema.name and name the columns
  you need (never SELECT *).'
- Do NOT compute totals in prose; return the rows or an aggregate (COUNT/SUM in the SQL).
- Never join to tables outside the catalog. If a question needs a column that is not listed here, return "System
  doesn't have the data."
views: []
