# BitopiSplint: order, file-reference and PCD data. Views are virtual (see docs/DATA_ACCESS.md):
# `definition:` is a T-SQL SELECT over the real tables that the model never sees. At execution the
# guarded SQL is wrapped as WITH rag_vw_<name> AS (<definition>) ... — no DDL is run on the server.
database: BitopiSplint
description: Export orders, buyer files, styles, colour/size breakdowns, PCD history and cancellation register.
dialect: tsql
connection_env: SQLSERVER_CONN_BITOPISPLINT
# Routing words (data/db_router.py, whole-word match). Factory codes (TAL, RHL …) are not listed: every
# database's rows belong to a factory, so they would pull HR or inventory questions here.
keywords: [order, orders, eo, exportorder, po, exportpo, style, styles, buyer, buyers, factory, merchandiser, pcd,
           ship, shipment, shipments, fileref, filerefno, cancel, cancelled, colour, color, size, lc, bom, sample,
           samples, booking, supplier, suppliers, lcs, bblc, expiry, expire, expires, expiring, invoiced]
# Discovered tables never offered to the SQL model (fnmatch, case-insensitive): history/backup
# copies, spreadsheet imports, scratch and test tables. Sensitive tables are excluded automatically.
exclude_tables: ["*back", "*backup*", "*$", "*$'", "*_old", "*_bak", "*.tmp*", "*.temp_*", "*_test", "*daytest"]
# Code columns in raw tables that hold another table's key, with no declared foreign key (schema RAG
# shows the join and pulls the target table in). Listed per table: checked read-only on 2026-09-28 that
# the codes resolve (tblSampleRequestMaster 5,000 of 5,000 sampled Buyer codes, BillsOfExchange 1,993 of
# 2,000, BuyerDormantData and ContractMaster all; FileRef is how the curated views get the buyer name).
# Other tables' Buyer columns hold something else (e.g. dbo.CheckAnit: 0 of 2,000 resolve), so they are
# not listed.
hints:
  - column: Buyer
    target: dbo.Contact_Master.ContactID
    note: "a buyer code such as C/09/7; the buyer's name is dbo.Contact_Master.ContactName"
    tables: [dbo.FileRef, dbo.tblSampleRequestMaster, dbo.BillsOfExchange, dbo.BuyerDormantData, dbo.ContractMaster]
rules:
  - Use TOP (n), never LIMIT. Use half-open date ranges with literal dates (col >= '2026-09-01' AND col < '2026-10-01').
  - Today is {today}. "This week" = Monday of this week to next Monday; "next week" = next Monday to the following Monday.
  - Reference views only as rag.<name> (rag.vw_ExportOrder, rag.vw_FileRef, ...).
  - Do NOT compute totals in prose; return the rows or an aggregate (COUNT/SUM in the SQL).
  - Never join to tables outside the catalog. If a question needs a column that is not listed here, return "System doesn't have the data."

# `scope_column:` names the column holding the factory short name (TAL, RHL, ...). Per-user row scope
# (PRD FR-4.4) filters on it: a user limited to some factories only sees rows of those factories, and a
# view without a scope column is not available to such a user at all.
views:
  - name: rag.vw_ExportOrder
    scope_column: Factory
    grain: one row per confirmed export order; ExportOrderID is unique.
    description: >
      Confirmed export orders with the plan cut date (PCD), ship date, factory, merchandiser, buyer name
      and current status. Excludes financial values (rate, order value) intentionally.
    key_columns: [ExportOrderID, ExportPONo]
    columns:
      ExportOrderID: internal order key, e.g. TAL-17-382-1
      ExportOrderNo: numeric order sequence
      ExportPONo: buyer's PO number as they quote it
      FileRefID: the file the order belongs to; joins rag.vw_FileRef
      FileRefNo: file reference number, e.g. FR-17-29
      Buyer: buyer name (from Contact_Master)
      BuyerStyleNo: buyer's style number
      StyleName: internal style name
      OrderQty: pieces (numeric)
      UOM: unit of measure (pcs typically)
      PCD: planned cut date
      PlanCutOffDate: planning cut-off date
      ShipDate: planned shipment date
      ExfactoryDate: planned ex-factory date
      ExportOrderStatus: ACTIVE / APPROVED FOR SHIPMENT / PENDING / PRODUCTION COMPLETE / READY FOR SHIPMENT / RUNNING / TO CLOSE / CLOSED / CANCELLED
      ExportOrderCategory: ALLOTED / CONFIRMED / PROJECTED
      ShipmentStatus: TO SHIP / SHIPPED / SHORT SHIPPED / CANCELLED — not kept up to date (most orders past their ship date still say TO SHIP); whether an order was invoiced for export is in rag.vw_OrderShipment
      Factory: factory short name — TAL, RHL, BGL, KTL, CKDL, or the raw company code for other units
      Merchandiser: merchandiser name from the file
      Season: buyer season
      PCDConfirmation: whether the PCD has been confirmed (1 / 0)
    definition: |
      SELECT
        eo.ExportOrderID,
        eo.ExportOrderNo,
        eo.ExportPONo,
        eo.FileRefID,
        fr.FileRefNo,
        buyer.ContactName        AS Buyer,
        eo.BuyerStyleNo,
        sm.StyleName,
        eo.OrderQty,
        eo.UOM,
        CAST(eo.PCD AS date)             AS PCD,
        CAST(eo.PlanCutOffDate AS date)  AS PlanCutOffDate,
        CAST(eo.ShipDate AS date)        AS ShipDate,
        CAST(eo.ExfactoryDate AS date)   AS ExfactoryDate,
        eo.ExportOrderStatus,
        eo.ExportOrderCategory,
        eo.ShipmentStatus,
        CASE fr.Factory
          WHEN '06' THEN 'TAL' WHEN '04' THEN 'BGL' WHEN '09' THEN 'RHL'
          WHEN '08' THEN 'KTL' WHEN '11' THEN 'CKDL' ELSE fr.Factory
        END AS Factory,
        fr.Merchandiser,
        fr.Season,
        eo.PCDConfirmation
      FROM dbo.ExportOrder eo
      LEFT JOIN dbo.FileRef fr        ON fr.FileRefID  = eo.FileRefID
      LEFT JOIN dbo.Contact_Master buyer ON buyer.ContactID = fr.Buyer
      LEFT JOIN dbo.Style_Master sm   ON sm.StyleId    = eo.StyleID

  - name: rag.vw_FileRef
    scope_column: Factory
    grain: one row per file reference (order file); FileRefID is unique.
    description: >
      Buyer file references with product category, planned fabric/trims in-house dates and current status.
      One file usually spans several export orders. The in-house dates are plans (checked 2026-10-06: 426 of
      1,477 active 2026 files have them in the future, none empty); actual receipts are not in this view.
    key_columns: [FileRefID, FileRefNo]
    columns:
      FileRefID: internal file key
      FileRefNo: file reference number, e.g. FR-17-29
      Buyer: buyer name
      BuyerDepartment: buyer department
      ProductCategory: product category
      FileRefDate: file creation date
      LastDeliveryDate: last delivery date on file
      OrderQty: total order quantity on the file
      FileStatus: ACTIVE / PENDING / CLOSED / CANCELLED
      OrderType: order type
      Factory: factory short name — TAL, RHL, BGL, KTL, CKDL, or the raw company code for other units
      Merchandiser: merchandiser name
      StyleName: primary style name
      Season: buyer season
      FabricFirstInhanseDate: PLANNED date for the first fabric in-house (a plan, not a receipt; often in the future)
      FabricSecondInhanseDate: planned date for the second fabric in-house
      TrimsFirstInhanseDate: PLANNED date for the first trims in-house (a plan, not a receipt)
      TrimsSecondInhanseDate: planned date for the second trims in-house
    definition: |
      SELECT
        fr.FileRefID,
        fr.FileRefNo,
        buyer.ContactName        AS Buyer,
        fr.BuyerDepartment,
        fr.ProductCategory,
        CAST(fr.FileRefDate      AS date) AS FileRefDate,
        CAST(fr.LastDeliveryDate AS date) AS LastDeliveryDate,
        fr.OrderQty,
        fr.FileStatus,
        fr.OrderType,
        CASE fr.Factory
          WHEN '06' THEN 'TAL' WHEN '04' THEN 'BGL' WHEN '09' THEN 'RHL'
          WHEN '08' THEN 'KTL' WHEN '11' THEN 'CKDL' ELSE fr.Factory
        END AS Factory,
        fr.Merchandiser,
        sm.StyleName,
        fr.Season,
        CAST(fr.FabricFirstInhanseDate  AS date) AS FabricFirstInhanseDate,
        CAST(fr.FabricSecondInhanseDate AS date) AS FabricSecondInhanseDate,
        CAST(fr.TrimsFirstInhanseDate   AS date) AS TrimsFirstInhanseDate,
        CAST(fr.TrimsSecondInhanseDate  AS date) AS TrimsSecondInhanseDate
      FROM dbo.FileRef fr
      LEFT JOIN dbo.Contact_Master buyer ON buyer.ContactID = fr.Buyer
      LEFT JOIN dbo.Style_Master sm      ON sm.StyleId      = fr.StyleID

  - name: rag.vw_ExportOrderColorSize
    scope_column: Factory
    grain: one row per export order per colour per size.
    description: Breakdown of an export order into colours and sizes with quantities.
    key_columns: [ExportOrderID, ColorName, SizeCode]
    columns:
      ExportOrderID: order key
      ExportPONo: buyer PO number
      ColorName: colour name
      Shade: shade
      SizeCode: size (e.g. S, M, L, XL)
      SizeQty: pieces for this colour/size
      ColorQty: total pieces for the colour
      Factory: factory short name of the order — TAL, RHL, BGL, KTL, CKDL, or the raw company code for other units
    definition: |
      SELECT
        eo.ExportOrderID,
        eo.ExportPONo,
        ec.ColorName,
        ec.Shade,
        ecs.SizeCode,
        ecs.SizeQty,
        ec.ColorQty,
        CASE fr.Factory
          WHEN '06' THEN 'TAL' WHEN '04' THEN 'BGL' WHEN '09' THEN 'RHL'
          WHEN '08' THEN 'KTL' WHEN '11' THEN 'CKDL' ELSE fr.Factory
        END AS Factory
      FROM dbo.ExportOrder eo
      INNER JOIN dbo.ExportColor ec      ON ec.ExportOrderID = eo.ExportOrderID
      INNER JOIN dbo.ExportColorSize ecs ON ecs.ExportColorID = ec.ExportColorID AND ecs.ExportOrderID = eo.ExportOrderID
      LEFT JOIN dbo.FileRef fr           ON fr.FileRefID = eo.FileRefID

  - name: rag.vw_PCDChangeHistory
    scope_column: Factory
    grain: one row per (ExportOrderID, version) of PCD/ship-date history.
    description: >
      History of PCD and ship-date changes from the ExportOrderBack audit table (4M+ rows).
      KNOWN LIMITATION: ExportOrderBack has no index on ExportOrderID (only on Serial), so a
      WHERE ExportOrderID = @eo filter is a full table scan and can exceed the 10s guard timeout.
      A DBA should add CREATE INDEX IX_ExportOrderBack_ExportOrderID ON dbo.ExportOrderBack(ExportOrderID)
      when materialising the real rag.* views (docs/DATA_ACCESS.md §6); until then this view may
      time out on some orders.
    key_columns: [ExportOrderID, VersionNo]
    columns:
      ExportOrderID: order key
      VersionNo: audit version number
      PCD: PCD value at that version
      ShipDate: ship date at that version
      UpdatedBy: username who updated
      DateUpdated: date the change was recorded
      Factory: factory short name of the order — TAL, RHL, BGL, KTL, CKDL, or the raw company code for other units
    definition: |
      SELECT
        eob.ExportOrderID,
        eob.VersionNo,
        CAST(eob.PCD      AS date) AS PCD,
        CAST(eob.ShipDate AS date) AS ShipDate,
        eob.UpdatedBy,
        CAST(eob.DateUpdated AS date) AS DateUpdated,
        CASE fr.Factory
          WHEN '06' THEN 'TAL' WHEN '04' THEN 'BGL' WHEN '09' THEN 'RHL'
          WHEN '08' THEN 'KTL' WHEN '11' THEN 'CKDL' ELSE fr.Factory
        END AS Factory
      FROM dbo.ExportOrderBack eob
      LEFT JOIN dbo.ExportOrder eo ON eo.ExportOrderID = eob.ExportOrderID
      LEFT JOIN dbo.FileRef fr     ON fr.FileRefID = eo.FileRefID

  - name: rag.vw_CancelledExportOrder
    scope_column: Factory
    grain: one row per cancelled export order.
    description: Register of cancelled export orders with cancellation date and reason (remarks).
    key_columns: [ExportOrderID]
    columns:
      ExportOrderID: order key
      FileRefNo: file reference number
      CompanyName: company / buyer name
      UnitName: unit name
      PCD: PCD at cancellation (stored as varchar in source; may be null)
      ShipDate: ship date at cancellation (stored as varchar in source; may be null)
      OrderQty: order quantity
      ExportOrderStatus: last order status
      CancelledBy: user who cancelled
      CancelledDate: date of cancellation
      Remarks: cancellation remarks / reason
      Factory: factory short name of the order — TAL, RHL, BGL, KTL, CKDL, or the raw company code for other units
    definition: |
      SELECT
        cel.ExportOrderID,
        cel.FileRefNo,
        cel.CompanyName,
        cel.UnitName,
        cel.PCD,
        cel.ShipDate,
        cel.OrderQty,
        cel.ExportOrderStatus,
        cel.CancelledBy,
        cel.CancelledDate,
        cel.Remarks,
        CASE fr.Factory
          WHEN '06' THEN 'TAL' WHEN '04' THEN 'BGL' WHEN '09' THEN 'RHL'
          WHEN '08' THEN 'KTL' WHEN '11' THEN 'CKDL' ELSE fr.Factory
        END AS Factory
      FROM dbo.CancellExportOrderList cel
      LEFT JOIN dbo.ExportOrder eo ON eo.ExportOrderID = cel.ExportOrderID
      LEFT JOIN dbo.FileRef fr     ON fr.FileRefID = eo.FileRefID

  # Phase K (Finance/LC agent). Master LCs: amendments do not update the master row (checked
  # 2026-10-06: 47 of 49 amended LCs still carry their original expiry), so the latest amendment's
  # dates win. Bank columns are sensitive and left out.
  - name: rag.vw_ExportLC
    scope_column: Factory
    grain: one row per export (master) LC or sales contract; MasterLCID is unique.
    description: >
      Export LCs and sales contracts opened by buyers, with the current expiry and last shipment dates
      (after amendments), amount, status and whether the LC is closed. Bank details are not included.
    key_columns: [MasterLCID, MasterLCRef]
    columns:
      MasterLCID: internal LC key, e.g. ML-26-86
      MasterLCRef: LC or contract reference, e.g. TAL/SRS/ZARA/667/026
      BuyerLCRef: the buyer's LC reference
      LCDate: date the LC or contract was opened
      Buyer: buyer name
      LCType: LC or Contract
      LCQty: quantity on the LC
      LCAmount: LC value
      Currency: currency code, e.g. USD
      LastShipDate: latest shipment date allowed (after amendments)
      ExpiryDate: LC expiry date (after amendments)
      OriginalExpiryDate: expiry date before any amendment
      Amended: 1 when an amendment changed the dates, else 0
      LCStatus: Approved / Propose / Rejected / Not Recommended
      LCClosed: 1 when the LC is closed, else 0
      Factory: factory short name (beneficiary company) — TAL, RHL, BGL, KTL, CKDL, or the raw company code for other units
    definition: |
      SELECT
        m.MasterLCID,
        m.MasterLCRef,
        m.BuyerLCRef,
        CAST(m.LCDate AS date) AS LCDate,
        buyer.ContactName AS Buyer,
        m.LCorContractType AS LCType,
        m.LCQty,
        m.LCAmt AS LCAmount,
        m.CurCode AS Currency,
        CAST(COALESCE(a.NewShipDate, m.ShipDate) AS date) AS LastShipDate,
        CAST(COALESCE(a.NewExpireDate, m.ExpiryDate) AS date) AS ExpiryDate,
        CAST(m.ExpiryDate AS date) AS OriginalExpiryDate,
        CASE WHEN a.MasterLCID IS NULL THEN 0 ELSE 1 END AS Amended,
        m.LCStatus,
        CAST(ISNULL(m.LCClosed, 0) AS int) AS LCClosed,
        CASE m.Beneficiary
          WHEN '06' THEN 'TAL' WHEN '04' THEN 'BGL' WHEN '09' THEN 'RHL'
          WHEN '08' THEN 'KTL' WHEN '11' THEN 'CKDL' ELSE m.Beneficiary
        END AS Factory
      FROM dbo.MasterLC m
      LEFT JOIN dbo.Contact_Master buyer ON buyer.ContactID = m.Buyer
      LEFT JOIN (
        SELECT MasterLCID, NewExpireDate, NewShipDate,
               ROW_NUMBER() OVER (PARTITION BY MasterLCID ORDER BY AmendmentDate DESC, SLNo DESC) AS rn
        FROM dbo.MasterLC_Amendment
        WHERE NewExpireDate IS NOT NULL
      ) a ON a.MasterLCID = m.MasterLCID AND a.rn = 1

  # Back-to-back LCs opened to suppliers. The close flag (IsLCClose) is not kept up to date (checked
  # 2026-10-06: 44,677 of TAL's 45,657 still "open"), so it is left out rather than shown as a status.
  # Cancelled and fake LCs are kept as columns; the tools filter them.
  - name: rag.vw_BackToBackLC
    scope_column: Factory
    grain: one row per back-to-back LC; BBLCID is unique.
    description: >
      Back-to-back LCs opened to fabric, trims and accessories suppliers against export LCs, with
      supplier, purpose, amount, last shipment date and expiry. Bank details are not included.
    key_columns: [BBLCID, BBLCNo]
    columns:
      BBLCID: internal key, e.g. BL-26-5340
      BBLCNo: back-to-back LC number
      BBLCDate: date the LC was opened
      Supplier: supplier name
      BBLCType: Local / Foreign Import / TT / RTGS LOCAL …
      Purpose: what it pays for, e.g. Fabric, Accessories
      BBLCAmount: LC value
      Currency: currency code
      LastShipDate: latest shipment date allowed
      ExpiryDate: LC expiry date
      MaturityDate: payment maturity date, when set
      GroupLCCode: group LC code
      ShipMode: shipment mode
      Cancelled: 1 when the LC was cancelled, else 0
      Fake: 1 for a placeholder ("fake") LC, else 0
      Factory: factory short name (opening company) — TAL, RHL, BGL, KTL, CKDL, or the raw company code for other units
    definition: |
      SELECT
        b.BBLCID,
        b.BBLCNo,
        CAST(b.BBLCDate AS date) AS BBLCDate,
        sup.ContactName AS Supplier,
        b.BBLCType,
        b.Purpose,
        b.BBLCAmt AS BBLCAmount,
        b.CurCode AS Currency,
        CAST(b.LastShipDate AS date) AS LastShipDate,
        CAST(b.LCExpireDate AS date) AS ExpiryDate,
        CAST(b.MaturityDateFrom AS date) AS MaturityDate,
        b.GroupLCCode,
        b.ShipMode,
        CAST(ISNULL(b.LCCancel, 0) AS int) AS Cancelled,
        CAST(ISNULL(b.FakeLC, 0) AS int) AS Fake,
        CASE b.Company
          WHEN '06' THEN 'TAL' WHEN '04' THEN 'BGL' WHEN '09' THEN 'RHL'
          WHEN '08' THEN 'KTL' WHEN '11' THEN 'CKDL' ELSE b.Company
        END AS Factory
      FROM dbo.BBLCMaster b
      LEFT JOIN dbo.Contact_Master sup ON sup.ContactID = b.SupplierCode

  # Phase K (Order agent). ShipmentStatus on the order is not kept up to date, so "shipped" is read
  # from the export invoices: an order with no invoice line has not been invoiced for export. Limited
  # to confirmed, not-cancelled orders with a ship date in the last 365 days or later. Orders with quantity 0
  # are placeholders (e.g. PO "TBA19"), not commitments, and are left out (38 of 761 "behind schedule" on 2026-10-06).
  - name: rag.vw_OrderShipment
    scope_column: Factory
    grain: one row per confirmed, not-cancelled export order with a quantity and a ship date from 365 days ago onward.
    description: >
      Whether each recent confirmed export order has been invoiced for export: invoiced quantity,
      number of export invoices and the first invoice's ex-factory date, next to the order's planned
      ship and ex-factory dates. No invoice (InvoicedQty empty) means not yet invoiced for export.
    key_columns: [ExportOrderID]
    columns:
      ExportOrderID: order key, e.g. TAL-17-382-1
      ExportPONo: buyer's PO number
      Buyer: buyer name
      OrderQty: order quantity in pieces
      ShipDate: planned ship date
      ExfactoryDate: planned ex-factory date
      ExportOrderStatus: order status (ACTIVE / RUNNING / READY FOR SHIPMENT / CLOSED …)
      Factory: factory short name — TAL, RHL, BGL, KTL, CKDL, or the raw company code for other units
      Merchandiser: merchandiser name
      InvoicedQty: pieces on export invoices; empty when the order has no export invoice
      Invoices: number of export invoices for the order
      FirstInvoiceExFactoryDate: ex-factory date on the order's first export invoice
    definition: |
      SELECT
        eo.ExportOrderID,
        eo.ExportPONo,
        buyer.ContactName AS Buyer,
        eo.OrderQty,
        CAST(eo.ShipDate AS date) AS ShipDate,
        CAST(eo.ExfactoryDate AS date) AS ExfactoryDate,
        eo.ExportOrderStatus,
        CASE fr.Factory
          WHEN '06' THEN 'TAL' WHEN '04' THEN 'BGL' WHEN '09' THEN 'RHL'
          WHEN '08' THEN 'KTL' WHEN '11' THEN 'CKDL' ELSE fr.Factory
        END AS Factory,
        fr.Merchandiser,
        s.InvoicedQty,
        s.Invoices,
        CAST(s.FirstExFactoryDate AS date) AS FirstInvoiceExFactoryDate
      FROM dbo.ExportOrder eo
      LEFT JOIN dbo.FileRef fr ON fr.FileRefID = eo.FileRefID
      LEFT JOIN dbo.Contact_Master buyer ON buyer.ContactID = fr.Buyer
      LEFT JOIN (
        SELECT ei.ExportOrderID, SUM(ei.ExportQty) AS InvoicedQty, COUNT(*) AS Invoices,
               MIN(i.ExFactoryDate) AS FirstExFactoryDate
        FROM dbo.EI_ExportOrder ei
        JOIN dbo.ExportInvoice i ON i.ExportInvoiceID = ei.ExportInvoiceID
        GROUP BY ei.ExportOrderID
      ) s ON s.ExportOrderID = eo.ExportOrderID
      WHERE eo.ExportOrderCategory = 'CONFIRMED'
        AND eo.ExportOrderStatus <> 'CANCELLED'
        AND eo.OrderQty > 0
        AND eo.ShipDate >= DATEADD(day, -365, CAST(GETDATE() AS date))

examples:
  - question: Which TAL orders have PCD next week?
    sql: |
      SELECT TOP (200) ExportOrderID, ExportPONo, Buyer, PCD, ShipDate, ShipmentStatus
      FROM rag.vw_ExportOrder
      WHERE Factory = 'TAL' AND PCD >= @nextMon AND PCD < @nextMon2
      ORDER BY PCD, ExportOrderID

  - question: How many orders per factory are shipping this month?
    sql: |
      SELECT TOP (50) Factory, COUNT(*) AS Orders
      FROM rag.vw_ExportOrder
      WHERE ShipDate >= @monthStart AND ShipDate < DATEADD(MONTH, 1, @monthStart)
      GROUP BY Factory
      ORDER BY Orders DESC

  - question: Show the PCD change history for order TAL-17-382-1.
    sql: |
      SELECT TOP (50) VersionNo, PCD, ShipDate, UpdatedBy, DateUpdated
      FROM rag.vw_PCDChangeHistory
      WHERE ExportOrderID = 'TAL-17-382-1'
      ORDER BY VersionNo
