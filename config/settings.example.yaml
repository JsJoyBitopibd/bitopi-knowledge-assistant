paths:
  pdf_root: data/pdfs
  index_dir: data/index
  prompts_dir: prompts
  catalog_dir: config/catalog
  fixed_tools: config/fixed_tools.yaml
  golden_set: tests/golden.jsonl
  scopes_file: config/scopes.yaml   # AD group -> what its members may see (copy scopes.example.yaml)
  users_file: config/users.yaml     # local sign-in users, auth.provider: local only (copy users.example.yaml)

# Sign-in and per-user scope (PRD FR-4). ldap = Active Directory (.env LDAP_HOST, LDAP_DOMAIN, LDAP_BASE_DN);
# local = config/users.yaml, for development and tests.
auth:
  provider: ldap
  max_failures: 5          # failed sign-ins per account ...
  lockout_seconds: 600     # ... within this window, then the account waits

ingest:
  chunk_target_chars: 2400     # ~600 tokens
  chunk_min_chars: 400
  chunk_overlap_chars: 250
  embed_batch_size: 32
  watch_interval_seconds: 300  # scripts/ingest_worker.py rescans data/pdfs this often
  # A missing file leaves the index after two consecutive scans miss it. If more files vanish in one
  # scan than this share of the indexed ones (and more than removal_alert_min_files), nothing is
  # removed and an alert is logged: an offline share must not empty the index (PRD FR-2.14).
  removal_alert_fraction: 0.05
  removal_alert_min_files: 3
  ocr_min_text_chars: 50       # below this a page is treated as scanned
  header_footer_min_share: 0.5 # a line in the top/bottom 3 lines of >= this share of pages is a header/footer

retrieval:
  vector_top_k: 20
  keyword_top_k: 20
  rrf_k: 60
  rerank_candidates: 10   # CPU cross-encoder cost is linear in candidates; final_top_k is 6
  final_top_k: 6
  default_filters:
    superseded: false

data:
  max_rows: 200
  timeout_seconds: 10
  timeout_seconds_heavy: 30      # fixed tools marked `heavy: true` in fixed_tools.yaml
  max_rows_to_llm: 50
  sql_retries: 1
  result_cache_ttl_seconds: 180   # SQL result cache; hits keep their original as-of time; 0 = off
  schema_rag: true                # show generated SQL the discovered tables a question needs (Phase C5)
  schema_rag_k: 6                 # tables selected per database (+ up to 6 foreign-key neighbours)
  big_table_rows: 1000000         # raw tables above this need a WHERE clause (guard)

llm:
  temperature: 0
  max_tokens_answer: 2048      # Gemini counts thinking tokens against this budget
  max_tokens_rewrite: 256
  max_tokens_route: 64
  max_tokens_sql: 1536
  max_chunks_to_llm: 8

answer:
  not_found_text: "System doesn't have the data."
  history_turns: 3
  cache_ttl_seconds: 3600         # repeat documents question served from cache; 0 = off
  templated: true                 # fixed-tool results written from a template, no model call (C7)
  template_rows: 25               # rows shown in a templated table

ui:
  title: "Bitopi Knowledge Assistant · pilot"
  suggestions:
    - "What is the PCD approval SOP?"
    - "Which export orders ship this month?"
    - "How many Kaspersky licences does the Group have?"
    - "What is the password change policy?"
