paths:
  pdf_root: data/pdfs
  index_dir: data/index
  prompts_dir: prompts
  catalog_dir: config/catalog
  fixed_tools: config/fixed_tools.yaml
  agents_dir: config/agents         # domain agents (Phase K, docs/AGENTS_DESIGN.md)
  reference_dir: config/reference   # entity dictionaries: companies, store aliases, metrics (Phase P1)
  golden_set: tests/golden.jsonl
  scopes_file: config/scopes.yaml   # AD group -> what its members may see (copy scopes.example.yaml)
  users_file: config/users.yaml     # local sign-in users, auth.provider: local only (copy users.example.yaml)

# Sign-in and per-user scope (PRD FR-4). ldap = Active Directory (.env LDAP_HOST, LDAP_DOMAIN, LDAP_BASE_DN);
# local = config/users.yaml, for development and tests. none = no sign-in: every visitor is one shared user
# whose scope is open_groups (from config/scopes.yaml) — only where the network decides who reaches the app.
auth:
  provider: ldap
  open_groups: [KA-Managers]   # auth.provider: none only; groups not in config/scopes.yaml stop the app
  max_failures: 5          # failed sign-ins per account ...
  lockout_seconds: 600     # ... within this window, then the account waits

scope:
  # a first folder under data/pdfs with one of these names holds that factory's documents (data/pdfs/TAL/…);
  # any other folder's documents are group-wide (factory ALL) unless a meta.yaml says otherwise
  factory_codes: [TAL, RHL, BGL, KTL, CKDL]

ingest:
  chunk_target_chars: 2400     # ~600 tokens
  chunk_min_chars: 400
  chunk_overlap_chars: 250
  embed_batch_size: 32
  watch_interval_seconds: 300  # scripts/ingest_worker.py rescans data/pdfs this often
  # A missing file leaves the index after two consecutive scans miss it. If more files vanish in one
  # scan than this share of the indexed ones (and more than removal_alert_min_files), nothing is
  # removed and an alert is logged: an offline share must not empty the index (PRD FR-2.14).
  removal_alert_fraction: 0.05
  removal_alert_min_files: 3
  ocr_min_text_chars: 50       # below this a page is treated as scanned
  header_footer_min_share: 0.5 # a line in the top/bottom 3 lines of >= this share of pages is a header/footer
  # The ingest scripts share the CPU with the chat app (Phase I4, docs/tuning_log.md): a lower priority,
  # fewer embedding threads, and a pause while the app is searching (data/index/app_busy).
  priority: below_normal       # normal | below_normal | idle
  embed_threads: 4             # the ingest scripts' embedding threads (EMBED_THREADS overrides); 0 = all cores
  yield_to_app: true
  yield_slice: 4               # chunks embedded between two checks of the app

retrieval:
  vector_top_k: 20
  keyword_top_k: 20
  rrf_k: 60
  rerank_candidates: 8    # CPU cross-encoder cost is linear in candidates (~0.3 s each); final_top_k is 6
  final_top_k: 6
  default_filters:
    superseded: false

data:
  max_rows: 200
  timeout_seconds: 10
  timeout_seconds_heavy: 30      # fixed tools marked `heavy: true` in fixed_tools.yaml
  max_rows_to_llm: 50
  sql_retries: 1
  result_cache_ttl_seconds: 180   # SQL result cache; hits keep their original as-of time; 0 = off
  schema_rag: true                # show generated SQL the discovered tables a question needs (Phase C5)
  schema_rag_k: 6                 # tables selected per database (+ up to 6 foreign-key neighbours); a catalog may set its own
  schema_rag_max_tables: 14       # at most this many tables per database in the prompt, neighbours included (P1)
  big_table_rows: 1000000         # raw tables above this need a WHERE clause (guard)
  max_databases_per_question: 2   # catalogs shown to the SQL model per question, ranked by data/db_router.py (J1)
  max_databases_per_question_max: 3   # one more when the next catalog ties the last pick on keywords (P1)
  values:                         # value index (P2.1, data/values.py): recorded names matched against the question
    enabled: true
    fuzzy_cutoff: 0.85            # difflib ratio a close match must reach ('mantainance store' ~ 'Maintenance Store' = 0.88)
  empty_retry:                    # self-correction after a model-written statement returns nothing (P2.2, data/empty_retry.py)
    enabled: true
    max_model_calls: 2            # extra SQL-model calls per question, only after an empty or failed first try (owner, 2026-10-08)
    max_seconds: 20               # wall clock from the first statement; no re-ask starts after it
    lookup_values: 20             # DISTINCT values read per filtered text column
    lookup_columns: 3             # text columns looked up per statement
  sql_cache_ttl_seconds: 86400    # question -> generated SQL replayed within the day (J2); 0 = off

llm:
  temperature: 0
  max_tokens_answer: 2048      # Gemini counts thinking tokens against this budget
  max_tokens_rewrite: 256
  max_tokens_route: 64
  max_tokens_sql: 4096         # Gemini thinks before writing SQL; at 1536 a third of the calls hit the limit and retried (+3 s)
  max_chunks_to_llm: 8
  daily_budget: 500            # provider requests per day this deployment may spend (free tier: 500 per model);
                               # the admin caption shows "calls today n/budget", scripts/eval.py --budget refuses to overspend

answer:
  not_found_text: "System doesn't have the data."
  history_turns: 3
  cache_ttl_seconds: 3600         # repeat documents question served from cache; 0 = off
  templated: true                 # fixed-tool results written from a template, no model call (C7)
  templated_generated: true       # model-written SQL results too (J3): the rows are the answer, no answer-model call
  template_rows: 25               # rows shown in a templated table

ui:
  title: "Bitopi Knowledge Assistant · pilot"
  suggestions:
    - "Show me the QC summary today"
    - "Which lines are above the DHU target today?"
    - "Which export orders ship this month?"
    - "What is the PCD approval SOP?"
    - "What is the password change policy?"
  utc_offset_hours: 6             # factory time for the greeting (Bangladesh, no daylight saving)

# Morning brief on the home screen (Phase L): the viewer's signals from the last scripts/watch.py run.
brief:
  enabled: true
  max_items: 5                    # "Needs your attention" items shown
  stale_after_minutes: 180        # warn when the last watcher run is older (the service runs every 60 minutes)
