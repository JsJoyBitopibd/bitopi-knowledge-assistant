# Data-quality checks (Phase K4, docs/AGENTS_DESIGN.md §3). Run: python scripts/data_quality.py
# Each check is ONE read-only SELECT returning ONE row, validated like a view definition (no parameters,
# no ORDER BY / TOP, no write or system keywords). Raw tables are fine: this is our SQL, not the model's.
#
#   kind: freshness  -> column last_date; "stale" when older than max_age_days
#   kind: count      -> column n; "issue" when n > max (default 0); max: null = information only
#   kind: share      -> columns bad, total; "issue" when bad / total > max_share
#
# `agent` groups the report; `fix` says who should act. Findings go to the data owners: Stage 2 risk
# levels are built only on domains whose checks are clean (AGENTS_DESIGN.md §4).
checks:
  # ---- Order
  - name: order_entries_fresh
    agent: order
    database: BitopiSplint
    kind: freshness
    max_age_days: 3
    what: Newest export order entered
    fix: none expected; a stale date means the order system stopped syncing to this server
    sql: SELECT MAX(DateAdded) AS last_date FROM dbo.ExportOrder

  - name: shipment_status_not_maintained
    agent: order
    database: BitopiSplint
    kind: share
    max_share: 0.2
    what: Confirmed orders with a ship date in the last 60 days that still say TO SHIP
    fix: commercial/merchandising update ShipmentStatus on shipment, or the assistant keeps reading export invoices instead
    sql: |
      SELECT
        SUM(CASE WHEN ShipmentStatus = 'TO SHIP' THEN 1 ELSE 0 END) AS bad,
        COUNT(*) AS total
      FROM dbo.ExportOrder
      WHERE ExportOrderCategory = 'CONFIRMED' AND ExportOrderStatus <> 'CANCELLED'
        AND ShipDate >= DATEADD(day, -60, CAST(GETDATE() AS date)) AND ShipDate < CAST(GETDATE() AS date)

  - name: confirmed_orders_without_quantity
    agent: order
    database: BitopiSplint
    kind: count
    max: null
    what: Confirmed, not-cancelled orders with a ship date in the last 365 days and quantity 0 (left out of shipment answers)
    fix: merchandising set the quantity or cancel the placeholder order
    sql: |
      SELECT COUNT(*) AS n
      FROM dbo.ExportOrder
      WHERE ExportOrderCategory = 'CONFIRMED' AND ExportOrderStatus <> 'CANCELLED' AND ISNULL(OrderQty, 0) <= 0
        AND ShipDate >= DATEADD(day, -365, CAST(GETDATE() AS date))

  - name: future_cancellations
    agent: order
    database: BitopiSplint
    kind: count
    what: Order cancellations dated in the future
    fix: merchandising correct the cancellation date
    sql: SELECT COUNT(*) AS n FROM dbo.CancellExportOrderList WHERE CancelledDate > CAST(GETDATE() AS date)

  # ---- Finance/LC
  - name: master_lc_fresh
    agent: finance_lc
    database: BitopiSplint
    kind: freshness
    max_age_days: 30
    what: Newest export LC opened
    fix: none expected; LCs open a few times a month
    sql: SELECT MAX(LCDate) AS last_date FROM dbo.MasterLC

  - name: lc_amendments_not_on_master
    agent: finance_lc
    database: BitopiSplint
    kind: count
    max: null
    what: Amended export LCs whose master row still shows the pre-amendment expiry (the LC view uses the amendment)
    fix: information only; commercial may want the master row updated on amendment
    sql: |
      SELECT COUNT(*) AS n
      FROM dbo.MasterLC m
      JOIN (
        SELECT MasterLCID, NewExpireDate,
               ROW_NUMBER() OVER (PARTITION BY MasterLCID ORDER BY AmendmentDate DESC, SLNo DESC) AS rn
        FROM dbo.MasterLC_Amendment
        WHERE NewExpireDate IS NOT NULL
      ) a ON a.MasterLCID = m.MasterLCID AND a.rn = 1
      WHERE m.ExpiryDate <> a.NewExpireDate

  - name: bblc_fresh
    agent: finance_lc
    database: BitopiSplint
    kind: freshness
    max_age_days: 7
    what: Newest back-to-back LC opened
    fix: none expected
    sql: SELECT MAX(BBLCDate) AS last_date FROM dbo.BBLCMaster

  - name: bblc_close_flag_not_maintained
    agent: finance_lc
    database: BitopiSplint
    kind: share
    max_share: 0.2
    what: Back-to-back LCs that expired over 180 days ago and are still not closed
    fix: commercial close back-to-back LCs when settled, so "open LCs" can be answered
    sql: |
      SELECT
        SUM(CASE WHEN ISNULL(IsLCClose, 0) = 0 THEN 1 ELSE 0 END) AS bad,
        COUNT(*) AS total
      FROM dbo.BBLCMaster
      WHERE ISNULL(LCCancel, 0) = 0 AND ISNULL(FakeLC, 0) = 0
        AND LCExpireDate < DATEADD(day, -180, CAST(GETDATE() AS date))

  # ---- Sourcing
  - name: goods_receipts_fresh
    agent: sourcing
    database: Inventory
    kind: freshness
    max_age_days: 3
    what: Newest goods receipt (GRN)
    fix: IT confirm where goods receipts are recorded now; the Sourcing agent's Stage-1 tools wait for current receipts
    sql: SELECT MAX(GRNDate) AS last_date FROM dbo.GRNMaster

  - name: po_dates_far_future
    agent: sourcing
    database: BitopiSplint
    kind: count
    what: Purchase orders dated more than a year ahead (typing errors such as year 9009)
    fix: purchase correct the PO date
    sql: SELECT COUNT(*) AS n FROM dbo.POMaster WHERE PODate > DATEADD(year, 1, CAST(GETDATE() AS date))

  # ---- Production
  - name: line_output_fresh
    agent: production
    database: PlanningTNA
    kind: freshness
    max_age_days: 2
    what: Newest day in the daily line record (VistaQ copy)
    fix: IT check the VistaQ copy job; the Production agent shows the date it has
    sql: SELECT MAX(Date) AS last_date FROM dbo.VistaQDailyProduction

  - name: line_rows_without_target
    agent: production
    database: PlanningTNA
    kind: share
    max_share: 0.2
    what: Daily line rows in the last 60 days of data with no day target (DayTarget 0)
    fix: IE/planning set a day target for every running line and style
    sql: |
      SELECT
        SUM(CASE WHEN ISNULL(DayTarget, 0) = 0 THEN 1 ELSE 0 END) AS bad,
        COUNT(*) AS total
      FROM dbo.VistaQDailyProduction
      WHERE Date >= DATEADD(day, -60, (SELECT MAX(Date) FROM dbo.VistaQDailyProduction))

  - name: line_targets_above_100_percent
    agent: production
    database: PlanningTNA
    kind: count
    max: null
    what: Daily line rows in the last 60 days of data planned at more than 100% efficiency (targets the line cannot reach)
    fix: information for IE/planning; "below target" counts depend on realistic targets
    sql: |
      SELECT COUNT(*) AS n
      FROM dbo.VistaQDailyProduction
      WHERE TargetEfficiency > 100
        AND Date >= DATEADD(day, -60, (SELECT MAX(Date) FROM dbo.VistaQDailyProduction))

  - name: bimob_hourly_line_fresh
    agent: production
    database: BiMob
    kind: freshness
    max_age_days: 2
    what: Newest day in the older hourly line table (BiMob)
    fix: information; this table appears retired — the agent uses the VistaQ copy instead
    sql: SELECT MAX(HourlyPdate) AS last_date FROM dbo.tblHourlyLineWiseProductionDetail

  # ---- HR (Phase R, 2026-10-13: the people databases were opened, and the first question asked of them —
  # "how many are present today?" — turned out to have no answer because every attendance source has stopped)
  - name: hrms_attendance_fresh
    agent: hr
    database: Hrms5Misami
    kind: freshness
    max_age_days: 2
    what: Newest working day in the HRMS day-status table (presence and absence)
    fix: HR/IT restart the attendance load; until then presence is answered for the newest day in the table, with that date
    sql: SELECT MAX(WorkDate) AS last_date FROM dbo.DaywisePayHour

  - name: hrms_punches_fresh
    agent: hr
    database: Hrms5Misami
    kind: freshness
    max_age_days: 2
    what: Newest working day in the raw punch table behind the day status
    fix: HR/IT; this stops on the same day as dbo.DaywisePayHour, so the break is upstream of both
    sql: SELECT MAX(WorkDate) AS last_date FROM dbo.DailyAttendance

  - name: hwatt_punches_fresh
    agent: hr
    database: HWATT
    kind: freshness
    max_age_days: 2
    what: Newest card read in the HWATT attendance devices
    fix: information; this device system appears retired, and its last month is partial
    sql: SELECT MAX(CardTime) AS last_date FROM dbo.KQZ_Card

  - name: hrms_overtime_fresh
    agent: hr
    database: Hrms5Misami
    kind: freshness
    max_age_days: 2
    what: Newest working day with overtime hours
    fix: HR/IT; overtime is derived from attendance and stops with it
    sql: SELECT MAX(WorkDate) AS last_date FROM dbo.DaywiseOTHour

  - name: hrms_active_staff_without_attendance
    agent: hr
    database: Hrms5Misami
    kind: share
    max_share: 0.05
    what: Active employees with no attendance row on the newest working day in the table
    fix: HR; an active employee who never appears cannot be counted present or absent
    sql: |
      SELECT
        SUM(CASE WHEN d.EmployeeCode IS NULL THEN 1 ELSE 0 END) AS bad,
        COUNT(*) AS total
      FROM dbo.tblEmployee e
      LEFT JOIN dbo.DaywisePayHour d
        ON d.EmployeeCode = e.EmployeeCode
       AND d.WorkDate = (SELECT MAX(WorkDate) FROM dbo.DaywisePayHour)
      WHERE e.EmployeeStatus = 'Active'

  - name: hrms_unknown_day_status
    agent: hr
    database: Hrms5Misami
    kind: count
    max: null
    what: Attendance rows in the last 60 loaded days whose DayStatus is not one of the codes the HR agent knows
    fix: information; a new code means prompts/agents/hr.txt and the Hrms5Misami table note must learn it, or presence is counted wrong
    sql: |
      SELECT COUNT(*) AS n
      FROM dbo.DaywisePayHour
      WHERE WorkDate >= DATEADD(day, -60, (SELECT MAX(WorkDate) FROM dbo.DaywisePayHour))
        AND DayStatus NOT IN ('P', 'L', 'PW', 'PH', 'LW', 'LH', 'A', 'LV', 'MLV', 'W', 'H')

  - name: hrms_overtime_barely_recorded
    agent: hr
    database: Hrms5Misami
    kind: share
    max_share: 0.5
    what: Employees with no overtime row in the last 365 loaded days, out of those who had one in 2019
    fix: HR/payroll say where overtime is recorded now; a total from this table is six people, not the workforce
    sql: |
      SELECT
        SUM(CASE WHEN r.EmployeeCode IS NULL THEN 1 ELSE 0 END) AS bad,
        COUNT(*) AS total
      FROM (SELECT DISTINCT EmployeeCode FROM dbo.DaywiseOTHour
            WHERE WorkDate >= '2019-01-01' AND WorkDate < '2020-01-01') o
      LEFT JOIN (SELECT DISTINCT EmployeeCode FROM dbo.DaywiseOTHour
                 WHERE WorkDate >= DATEADD(day, -365, (SELECT MAX(WorkDate) FROM dbo.DaywiseOTHour))) r
        ON r.EmployeeCode = o.EmployeeCode

  - name: hrms_attendance_covers_the_group
    agent: hr
    database: Hrms5Misami
    kind: share
    max_share: 0.2
    what: Active employees on the group list with no attendance row on the newest working day in the table
    fix: HR/IT; attendance here is one instance's population, so "how many are present" cannot be answered for the group
    sql: |
      SELECT
        SUM(CASE WHEN d.EmployeeCode IS NULL THEN 1 ELSE 0 END) AS bad,
        COUNT(*) AS total
      FROM dbo.vwAllCompanyEmployeeList g
      LEFT JOIN dbo.DaywisePayHour d
        ON d.EmployeeCode = g.EmployeeCode
       AND d.WorkDate = (SELECT MAX(WorkDate) FROM dbo.DaywisePayHour)
      WHERE g.EmployeeStatus = 'Active'

  - name: hrms_salary_month_fresh
    agent: hr
    database: Hrms5Misami
    kind: freshness
    max_age_days: 70
    what: Newest salary month on the monthly salary sheet (dated to the first of that month)
    fix: HR/payroll; a sheet is written when payroll is processed, so this passes at about 40 days and flags once a whole month is missing
    sql: |
      SELECT MAX(DATEFROMPARTS(YearNo, MonthNo, 1)) AS last_date FROM dbo.MonthWiseSalaryInfo

  # ---- Other (seen while building)
  - name: visitor_dates_missing
    agent: other
    database: HR
    kind: share
    max_share: 0.05
    what: Visitor records with no date added
    fix: HR/admin; date questions about visitors cannot be answered
    sql: |
      SELECT SUM(CASE WHEN DateAdded IS NULL THEN 1 ELSE 0 END) AS bad, COUNT(*) AS total
      FROM dbo.VisitorInformation

  # ---- Quality (VistaQ). The Stage-1 -> Stage-2 gate (docs/AGENTS_DESIGN.md §4) is per domain: a domain
  # starts Stage 2 only once its data-quality report is clean enough to trust. Quality is the one domain
  # whose data is live, but it had no checks at all, so it could not evidence the gate either way.
  # These are the FIRST checks to run against the VistaQ host (SQLSERVER_CONN_VISTAQ); every other check
  # reads the production server. dbo.QualityInspection holds ~88 million rows: only ever filter or
  # aggregate on the date-only indexed columns, never on InspectionDate/ActivityDate.
  - name: vistaq_inspections_fresh
    agent: quality
    database: VistaQ_Default_RHL
    kind: freshness
    max_age_days: 2
    what: Newest sewing-line inspection recorded in VistaQ
    fix: IT/VistaQ; line quality, DHU and the quality risk level are all read from this table, so they stop with it
    sql: |
      SELECT MAX(InspectionDateOnly) AS last_date FROM dbo.QualityInspection

  - name: vistaq_defects_fresh
    agent: quality
    database: VistaQ_Default_RHL
    kind: freshness
    max_age_days: 2
    what: Newest defect recorded against an inspection
    fix: IT/VistaQ; DHU is defects divided by pieces checked, so defects stopping while inspections continue makes every DHU read low
    sql: |
      SELECT MAX(InspectionDefectDateOnly) AS last_date FROM dbo.QualityInspectionDefect

  - name: vistaq_factory_coverage
    agent: quality
    database: VistaQ_Default_RHL
    kind: share
    max_share: 0
    what: Factories that inspected in the last 7 days but have nothing on the newest inspection day
    fix: IT/QC; a factory missing from the newest day makes a group DHU the DHU of only the factories that did report
    sql: |
      SELECT SUM(CASE WHEN f.OnLatest = 0 THEN 1 ELSE 0 END) AS bad, COUNT(*) AS total
      FROM (
        SELECT qi.WorkspaceFactoryId,
               MAX(CASE WHEN qi.InspectionDateOnly = m.LatestDay THEN 1 ELSE 0 END) AS OnLatest
        FROM dbo.QualityInspection qi
        CROSS JOIN (SELECT MAX(InspectionDateOnly) AS LatestDay FROM dbo.QualityInspection) AS m
        WHERE qi.InspectionDateOnly >= DATEADD(day, -7, m.LatestDay)
        GROUP BY qi.WorkspaceFactoryId
      ) AS f

  - name: vistaq_summary_job_lag
    agent: quality
    database: VistaQ_Default_RHL
    kind: count
    max: 2
    what: Days the DefectSummary / QCSummary job is behind the live inspection tables (the worse of the two)
    fix: IT/VistaQ restart or re-point the summary job; it was reported behind on 7 Oct 2026 (29 Sep / 5 Oct) and nothing has measured it since
    sql: |
      SELECT CASE WHEN x.qc_lag >= x.defect_lag THEN x.qc_lag ELSE x.defect_lag END AS n
      FROM (
        SELECT
          ISNULL(DATEDIFF(day, (SELECT MAX(InspectionDate) FROM dbo.QCSummary),
                               (SELECT MAX(InspectionDateOnly) FROM dbo.QualityInspection)), 9999) AS qc_lag,
          ISNULL(DATEDIFF(day, (SELECT MAX(InspectionDefectDate) FROM dbo.DefectSummary),
                               (SELECT MAX(InspectionDefectDateOnly) FROM dbo.QualityInspectionDefect)), 9999) AS defect_lag
      ) AS x

  - name: vistaq_targets_sane
    agent: quality
    database: VistaQ_Default_RHL
    kind: count
    max: 0
    what: Problems in the VistaQ quality targets that the amber level is read from
    fix: QC/VistaQ admin; amber comes from this row, so a missing, duplicated, expired or impossible target silently moves every amber level
    sql: |
      SELECT
        CASE WHEN (SELECT COUNT(*) FROM dbo.Threshold WHERE ISNULL(IsActive, 0) = 1) <> 1 THEN 1 ELSE 0 END
        + (SELECT COUNT(*) FROM dbo.Threshold
           WHERE ISNULL(IsActive, 0) = 1
             AND (DHUThreshold <= 0 OR DHUThreshold > 100
                  OR RejectRateThreshold < 0 OR RejectRateThreshold > 100
                  OR EffectiveFrom > CAST(GETDATE() AS date)
                  OR (EffectiveTo IS NOT NULL AND EffectiveTo < CAST(GETDATE() AS date)))) AS n

  - name: vistaq_inspections_without_a_file
    agent: quality
    database: VistaQ_Default_RHL
    kind: share
    max_share: 0.05
    what: Inspections on the newest day whose production plan carries no ERP file number (FR)
    fix: IE/planning set the file on every plan; quality grouped by file, and the order-level risk level, cover only the inspections whose plan carries one
    sql: |
      SELECT SUM(CASE WHEN p.Id IS NULL OR p.FileId IS NULL OR LTRIM(RTRIM(p.FileId)) = ''
                      THEN 1 ELSE 0 END) AS bad,
             COUNT(*) AS total
      FROM dbo.QualityInspection qi
      LEFT JOIN dbo.ProductionPlan p ON p.Id = qi.ProductionPlanId
      WHERE qi.InspectionDateOnly = (SELECT MAX(InspectionDateOnly) FROM dbo.QualityInspection)
