# Two containers from the same image sharing the index and PDFs:
#   app           - the Streamlit UI
#   ingest-worker - rescans data/pdfs and re-ingests on a schedule, so new PDFs reach the app
#                   without a restart (the app hot-reloads its caches when the index changes)
#   aggregates    - refreshes the pre-computed heavy results (config/aggregates.yaml) daily;
#                   one read-only scan each, swapped into data/index/aggregates.db atomically
#
#   docker compose up -d
#
# Mounts (host paths are examples; adjust to where .env, the index, PDFs and model cache live):
#   ./.env            secrets: Gemini key + SQL Server credentials
#   ./data/index      Chroma + BM25 + registry (shared writer = worker, readers = app)
#   ./data/pdfs       source documents
#   ./data/models     exported ONNX models (scripts/export_reranker_onnx.py)
#   ~/.cache/huggingface -> /models   bge-m3 + reranker weights (~6.5 GB), so neither container re-downloads
services:
  app:
    build: .
    image: bitopi-assistant:1.0
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data/index:/app/data/index
      - ./data/pdfs:/app/data/pdfs
      - ./data/models:/app/data/models      # int8 ONNX reranker (RERANK_BACKEND=onnx)
      - ${HF_CACHE:-~/.cache/huggingface}:/models
    mem_limit: 8g
    restart: unless-stopped

  ingest-worker:
    image: bitopi-assistant:1.0
    depends_on:
      - app
    command: ["python", "scripts/ingest_worker.py"]
    env_file: .env
    volumes:
      - ./data/index:/app/data/index
      - ./data/pdfs:/app/data/pdfs
      - ${HF_CACHE:-~/.cache/huggingface}:/models
    mem_limit: 8g
    restart: unless-stopped

  aggregates:
    image: bitopi-assistant:1.0
    depends_on:
      - app
    command: ["python", "scripts/refresh_aggregates.py", "--every", "24"]
    env_file: .env
    volumes:
      - ./data/index:/app/data/index
    mem_limit: 2g
    restart: unless-stopped
